# service-placement.yml — SINGLE SOURCE OF TRUTH for the two-VM topology.
#
# WHY: walter-vm ran ~30 services on one box. Under load spikes (observed load
# 98 on 16 vCPU, swap full) heavy non-critical services (posthog) starved
# cloudflared → the tunnel deregistered → the whole box "stopped responding",
# taking the production-critical LLM path down with it. See ADR-0028.
#
# FIX: segregate services across two VMs + DUPLICATE the LLM path (active on
# both) so the customer-facing AI gateway never shares fate with the homelab.
# Every service also gets a hard resource cap so no single one can starve a VM.
#
# CURRENT STATUS: this is the desired-state placement manifest for the two-VM
# migration. The current `ansible/walter-vm.yml` still targets the compatibility
# `walter_vm` group and does not consume this file yet.
#
# HOW TO READ: each entry lists the VM group(s) it should run on.
# `duplicated: true` = runs on BOTH (HA). Resource caps are docker `mem_limit` /
# `cpus` (cgroup), sized for a ~16 vCPU / 30 GiB box; scale proportionally for
# other sizes. `deploy_unit` distinguishes deployable service directories from
# containers inside an existing compose stack or host-level agent bundles.
# To move a service: edit one line here, then wire the future Ansible migration
# playbook to honor the manifest.
#
# Placement rules (operator directives, 2026-06-06):
#   - ALL LLM components are duplicated (litellm, its db, the 3 sub-routers,
#     llm-proxies) → active on both VMs behind the gateway.
#   - posthog (heavy analytics, the CPU hog) lives on ONE VM only (aux).
#   - cloudflared + observability agents run on BOTH (each VM needs its own).
#   - vm_core = critical path + light infra, isolated from heavy services.
#   - vm_aux  = heavy / non-critical homelab + the SECONDARY LLM replica.

placement_meta:
  vms:
    vm_core:
      role: "Production-critical path + light infra. Nothing heavy lands here."
      hetzner_type_min: "CPX41 (8 vCPU / 16 GiB) — current 16/30 class fine"
    vm_aux:
      role: "Heavy / non-critical homelab + secondary LLM replica."
      hetzner_type_min: "CPX41+ — sized for posthog + plane + synapse"
  llm_ha:
    strategy: "active-active behind the gateway hostname"
    detail: >-
      Both VMs run a full litellm stack. The public llm.${WALTER_DOMAIN}
      ingress balances/fails over between vm_core:4000 and vm_aux:4000 via
      cloudflared load-balancing (or a small Caddy/HAProxy in front). If either
      VM dies, the AI pipeline keeps serving from the other. litellm-db is
      per-VM (each replica owns its own spend/key DB); virtual-key definitions
      are identical via the same config.yaml. (Cross-VM DB replication is NOT
      required for stateless gateway use — see ADR-0028 "open questions".)

# ─────────────────────────────────────────────────────────────────────────────
# DUPLICATED — the LLM path (active on BOTH vms). The whole reason for this work.
# ─────────────────────────────────────────────────────────────────────────────
services:
  litellm:
    deploy_unit: compose_stack
    service_dir: litellm
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "4"
    mem_limit: "3g"
    notes: "Gateway. Bounded Prisma pool (ADR-0027). Healthcheck on /health/liveliness."
  litellm-db:
    deploy_unit: compose_service
    service_dir: litellm
    compose_service: litellm-db
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "2"
    mem_limit: "1g"
    notes: "Per-VM Postgres (postgres:16-alpine). max_connections tuned + SELECT-1 healthcheck."
  chatgpt-codex-router:
    deploy_unit: compose_stack
    service_dir: chatgpt-codex-router
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "2"
    mem_limit: "1g"
  claude-sub-router:
    deploy_unit: compose_stack
    service_dir: claude-sub-router
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "2"
    mem_limit: "1g"
  gemini-sub-router:
    deploy_unit: compose_stack
    service_dir: gemini-sub-router
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "2"
    mem_limit: "1g"
  llm-proxies:
    deploy_unit: compose_stack
    service_dir: llm-proxies
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "2"
    mem_limit: "1g"

  # ───── INFRA — runs on BOTH (each VM needs its own copy) ─────
  cloudflared:
    deploy_unit: host_service
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "1"
    mem_limit: "256m"
    notes: "Per-VM tunnel connector. Restart=always + --ha-connections (ADR-0027)."
  observability-agents:
    deploy_unit: host_agent_bundle
    service_dir: observability
    vms: [vm_core, vm_aux]
    duplicated: true
    cpus: "1"
    mem_limit: "512m"
    notes: "node-exporter + promtail/cadvisor on each VM; ship to the single Grafana/Prom/Loki on vm_core."

  # ───── vm_core ONLY — critical/light infra ─────
  infisical:
    vms: [vm_core]
    duplicated: false
    cpus: "2"
    mem_limit: "1.5g"
    notes: "Secrets backend (+ db + redis). Single instance; litellm sidecar caches secrets so a transient outage doesn't break a running gateway."
  observability:
    vms: [vm_core]
    duplicated: false
    cpus: "2"
    mem_limit: "3g"
    notes: "Grafana + Prometheus + Loki server. Single pane for both VMs."
  headscale:
    vms: [vm_core]
    duplicated: false
    cpus: "1"
    mem_limit: "512m"
  wireguard:
    vms: [vm_core]
    duplicated: false
    cpus: "1"
    mem_limit: "256m"
  uptime-kuma:
    vms: [vm_core]
    duplicated: false
    cpus: "1"
    mem_limit: "512m"
  restic:
    vms: [vm_core]
    duplicated: false
    cpus: "1"
    mem_limit: "512m"
    notes: "Backups — also schedule on vm_aux for its stateful services."
  syncthing:
    vms: [vm_core]
    duplicated: false
    cpus: "1"
    mem_limit: "512m"

  # ───── vm_aux ONLY — heavy / non-critical homelab ─────
  posthog:
    vms: [vm_aux]
    duplicated: false
    cpus: "4"
    mem_limit: "6g"
    notes: "HARD CAP — this is the CPU hog (224% observed). Single instance, isolated from the critical LLM path. Includes clickhouse + workers."
  plane:
    vms: [vm_aux]
    duplicated: false
    cpus: "3"
    mem_limit: "4g"
    notes: "Project mgmt stack (api/web/worker/db/redis/mq/minio)."
  n8n:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
  metabase:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
  postiz:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
    profile: devrel
  penpot:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
    profile: design
  drawio:
    vms: [vm_aux]
    duplicated: false
    cpus: "1"
    mem_limit: "512m"
  rocketchat:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
  synapse:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
    notes: "Matrix homeserver — heavy."
  openclaw:
    vms: [vm_aux]
    duplicated: false
    cpus: "1"
    mem_limit: "1g"
  hermes-agent:
    vms: [vm_aux]
    duplicated: false
    cpus: "1"
    mem_limit: "1g"
    profile: hermes-agent
  control-tower:
    vms: [vm_aux]
    duplicated: false
    cpus: "1"
    mem_limit: "1g"
  homepage:
    vms: [vm_aux]
    duplicated: false
    cpus: "1"
    mem_limit: "256m"
  forgejo:
    vms: [vm_aux]
    duplicated: false
    cpus: "2"
    mem_limit: "2g"
    notes: "Self-hosted git. Non-critical for the product runtime."
