# Pinning manifest for vendored third-party skills + MCP servers.
#
# This file is enforced by daily-supply-chain-audit. Every vendored skill must:
# - be listed in [skills] with a full 40-char upstream commit SHA;
# - be listed in [skill_content_sha256] with the current local content hash.
#
# To refresh a content hash after reviewing an intentional vendored change:
#
#   python3 skills/daily-supply-chain-audit/scripts/check-pinning.py \
#     --vendored-skills skills/daily-supply-chain-audit/assets/pinned-refs.toml \
#     skills
#
# If the checker reports a content mismatch, review the diff and update the
# corresponding hash below only after the upstream pin and local contents are
# both intentional.

