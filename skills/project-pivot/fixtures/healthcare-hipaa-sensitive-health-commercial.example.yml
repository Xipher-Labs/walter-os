# Example pivot output for: healthcare + HIPAA + sensitive-health + commercial
# This fixture represents a typical LLM response for a commercial healthcare
# application that processes Protected Health Information (PHI) under HIPAA.
#
# Used by tests/skills/pivot.bats [AC-3, AC-4, AC-5, AC-7]

inputs:
  domain: healthcare
  compliance:
    - hipaa
    - soc2
  data_sensitivity: sensitive-health
  project_type: commercial

agents_md_draft: |
  ---
  # AGENTS.md — <Project Name>
  # Generated by project-pivot skill. Review and edit before committing.

  ## Context

  Commercial healthcare software operating under HIPAA and SOC 2. Handles
  Protected Health Information (PHI) including patient records, diagnoses,
  and clinical data.

  ## Hard rules

  - NEVER send data tagged PHI to external APIs. Route all PHI processing to
    local Ollama only. External LLM APIs (Anthropic, OpenAI, Google) are
    prohibited from receiving any PHI.
  - NEVER log patient identifiers, diagnoses, or clinical data at any log level.
    Use opaque IDs and structured logging with field-level redaction.
  - NEVER commit real or real-derived patient data to any repository, including
    test fixtures. Use synthetic data generated by approved tools.
  - NEVER store PHI without encryption at rest (AES-256 minimum) and in transit
    (TLS 1.3).
  - Every read of patient data must emit an audit event with: reader identity,
    patient record affected, timestamp, reason, and consent verification status.
  - Business Associate Agreements (BAA) required with every vendor that processes
    or accesses PHI, including cloud providers and monitoring services.
  - Any change touching PHI storage, access control, or audit logging is
    auto-escalated to major task level and triggers both reviewer and
    security-auditor subagent review.

  ## Skill loading

  - medical-data-compliance
  - web-security-baseline
  - data-migration-safety

  ## Branch flow

  Full enforcement: feature → dev → staging → main. No skipping.
  Dev environment uses synthetic patient data only — never real PHI.
  Staging uses de-identified or synthetic data with documented de-identification method.
  Reviewer subagent is mandatory for all PRs.

  ## Never do

  - Send PHI to Anthropic, OpenAI, Google, or any external LLM API.
  - Use cloud analytics (Google Analytics, Mixpanel, etc.) on pages that display PHI.
  - Include PHI in error messages returned to the client.
  - Debug using real patient records; use synthetic fixtures instead.
  - Skip the medical-data-compliance skill for any feature touching patient data flows.
  ---

recommended_hooks:
  - pre-commit-phi-scan.sh — scan commits for PHI patterns (names, dates, diagnoses, identifiers)
  - medical-data-compliance.sh — verify PHI routing and encryption requirements before commit
  - pre-commit-secrets-scan.sh — block credentials and API keys from being committed

recommended_mcps:
  - github — PR management and code review
  - postgres — primary database (verify BAA coverage with hosting provider)

compliance_checklist:
  - "[ ] Local LLM routing verified for all PHI data paths (Ollama on local/self-hosted infra)"
  - "[ ] BAA signed with all vendors that process or access PHI"
  - "[ ] PHI access audit log implemented: reader ID, patient ID, timestamp, reason, consent"
  - "[ ] Encryption at rest verified (AES-256 minimum) for all PHI storage"
  - "[ ] TLS 1.3 enforced on all endpoints that transmit PHI"
  - "[ ] Synthetic patient data used in all development and staging environments"
  - "[ ] Patient rights flows implemented: access, rectification, deletion, portability"
  - "[ ] Breach response plan documented and rehearsed"
  - "[ ] Security risk assessment documented (HIPAA requires formal risk analysis)"
  - "[ ] SOC 2 change management log maintained for all production changes"
  - "[ ] Workforce training records maintained for all team members with PHI access"
