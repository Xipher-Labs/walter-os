# Example pivot output for: fintech + PCI-DSS + financial + commercial
# This fixture represents a typical LLM response for a commercial fintech product
# that processes payment cards and falls under PCI-DSS scope.
#
# Used by tests/skills/pivot.bats [AC-3, AC-4, AC-6, AC-7]

inputs:
  domain: fintech
  compliance:
    - pci-dss
    - soc2
  data_sensitivity: financial
  project_type: commercial

agents_md_draft: |
  ---
  # AGENTS.md — <Project Name>
  # Generated by project-pivot skill. Review and edit before committing.

  ## Context

  Commercial fintech product operating under PCI-DSS and SOC 2 compliance.
  Handles financial data including payment card transactions.

  ## Hard rules

  - NEVER log raw card numbers, CVVs, or full PANs. Tokenize at ingress.
  - NEVER store cardholder data unless explicitly required by the payment flow and
    documented in the PCI-DSS scope assessment. Use a PCI-compliant vault instead.
  - NEVER commit secrets, API keys, or payment processor credentials to any repository.
  - NEVER disable audit logging for financial transactions, even in development.
  - Financial amounts: use integer cents/minor-currency-units in code; render
    human-readable amounts only in display layer with explicit decimal handling.
  - Any change touching payment flows, card data, or payout logic is auto-escalated
    to major task level and triggers security-auditor subagent review.

  ## Skill loading

  - web-security-baseline
  - pci-dss-checklist
  - data-migration-safety

  ## Branch flow

  Full enforcement: feature → dev → staging → main. No skipping.
  Staging must run against a PCI-compliant test environment with no real card data.
  Reviewer subagent is mandatory for all PRs touching payment logic.

  ## Never do

  - Store PANs in plaintext in any database, log, or file.
  - Use non-PCI-compliant payment libraries without explicit security review.
  - Send financial transaction details to external LLM APIs (use synthetic data in tests).
  - Skip the security-auditor subagent for changes in payment or auth paths.
  - Expose card data to frontend JavaScript beyond tokenized references.
  ---

recommended_hooks:
  - pre-commit-secrets-scan.sh — block commits with hardcoded payment credentials or API keys
  - pre-commit-phi-scan.sh — catch accidental inclusion of card numbers matching Luhn algorithm

recommended_mcps:
  - github — PR management, code review automation
  - stripe — payment API integration (high-risk profile; confirm before enabling)
  - postgres — primary database access
  - sentry — error monitoring (configured to scrub financial data from payloads)

compliance_checklist:
  - "[ ] PCI-DSS SAQ type determined and documented (SAQ A, A-EP, D, or other)"
  - "[ ] Cardholder data scoping document defines all systems that touch PANs"
  - "[ ] Tokenization verified: no raw PANs stored in application database"
  - "[ ] Card data never appears in application logs at any log level"
  - "[ ] All payment API credentials stored in secrets manager, not .env files"
  - "[ ] TLS 1.2+ enforced on all payment endpoints; TLS 1.0/1.1 disabled"
  - "[ ] Penetration test scheduled (required annually under PCI-DSS)"
  - "[ ] Incident response plan includes payment breach notification procedure"
  - "[ ] SOC 2 change management log maintained for all production changes"
  - "[ ] Access control review: principle of least privilege on payment systems"
