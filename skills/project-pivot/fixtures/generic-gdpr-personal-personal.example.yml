# Example pivot output for: generic + GDPR + personal (data) + personal (project type)
# This fixture represents a typical LLM response for a personal/hobby project
# that collects some personal data (e.g., user accounts) and operates in a
# GDPR-relevant context.
#
# Used by tests/skills/pivot.bats [AC-3, AC-4, AC-7]

inputs:
  domain: generic
  compliance:
    - gdpr
  data_sensitivity: personal
  project_type: personal

agents_md_draft: |
  ---
  # AGENTS.md — <Project Name>
  # Generated by project-pivot skill. Review and edit before committing.

  ## Context

  Personal/hobby project of a general nature. Collects personal data (e.g., user
  accounts, email addresses) in a GDPR-relevant context. Lightweight setup with
  sensible defaults.

  ## Hard rules

  - Collect only the minimum personal data required for the feature. Every
    personal data field must have a documented purpose.
  - Provide users with a way to request deletion of their data.
  - NEVER sell, share, or expose user personal data to third parties without
    explicit consent.
  - NEVER commit real user data to any repository, including anonymized snapshots
    that could be re-identified.
  - All personal data in transit must use TLS. No plaintext transmission.
  - If this project grows beyond a personal side project, re-run `walter pivot`
    with `project_type: commercial` to get updated recommendations.

  ## Skill loading

  - web-security-baseline

  ## Branch flow

  Relaxed: feature branches merge to main directly for personal projects.
  Reviewer subagent optional but recommended for features touching user data.

  ## Never do

  - Hardcode secrets or API keys in any committed file.
  - Collect personal data without a visible, understandable privacy notice.
  - Share user data with analytics providers without user consent.
  - Ignore GDPR deletion requests — implement a soft-delete or anonymization path.
  ---

recommended_hooks:
  - pre-commit-secrets-scan.sh — prevent credentials from being committed

recommended_mcps:
  - github — repo and PR management
  - supabase — managed Postgres with built-in auth and row-level security

compliance_checklist:
  - "[ ] Privacy notice published and accessible to users before data collection"
  - "[ ] Data subject rights supported: access export and deletion/anonymization"
  - "[ ] Personal data inventory documented (what is collected, why, retention period)"
  - "[ ] TLS enforced on all endpoints that handle personal data"
  - "[ ] No personal data in application logs"
  - "[ ] Breach notification plan defined (even for a personal project, good hygiene)"
