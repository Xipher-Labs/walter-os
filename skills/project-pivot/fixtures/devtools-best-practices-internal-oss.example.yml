# Example pivot output for: devtools + best-practices + internal + oss-contribution
# This fixture represents a typical LLM response for contributing to an open-source
# developer tooling project with no formal compliance requirement and internal/business
# data only.
#
# Used by tests/skills/pivot.bats [AC-3, AC-4, AC-7]

inputs:
  domain: devtools
  compliance:
    - best-practices
  data_sensitivity: internal
  project_type: oss-contribution

agents_md_draft: |
  ---
  # AGENTS.md — <Project Name>
  # Generated by project-pivot skill. Review and edit before committing.

  ## Context

  Contributing to an open-source developer tooling project. No formal compliance
  requirement. Handles internal/business data only — no PII or PHI. Follow the
  upstream project's conventions while layering Walter-OS discipline on top.

  ## Hard rules

  - Follow the upstream project's CONTRIBUTING.md, coding standards, and PR process.
    Walter-OS workflows sit on top of these, never override them.
  - NEVER commit credentials, API keys, or tokens — not even in examples or tests.
  - NEVER store or transmit internal business data in test fixtures committed to
    public repositories.
  - No internal-only data in commits, PR descriptions, or issue comments that will
    be public.
  - All commits must pass the upstream CI checks before opening a PR upstream.

  ## Skill loading

  - web-security-baseline

  ## Branch flow

  Relaxed: local feature branch → open PR to upstream. Internal `dev` branch
  optional. Reviewer subagent recommended but not mandatory for small changes.
  For larger contributions, use Walter-OS TDD discipline locally before
  opening the upstream PR.

  ## Never do

  - Ignore the upstream project's linting rules or CI requirements.
  - Open a PR upstream before the full upstream test suite passes locally.
  - Add Walter-OS-specific tooling to the upstream project without upstream maintainer approval.
  - Commit internal business context or proprietary data to the public fork.
  ---

recommended_hooks:
  - pre-commit-secrets-scan.sh — prevent accidental credential commits to a public repo

recommended_mcps:
  - github — PR management, upstream repo interaction, issue tracking

compliance_checklist:
  - "[ ] Upstream CONTRIBUTING.md read and requirements met"
  - "[ ] Full upstream test suite passes locally before opening PR"
  - "[ ] No internal/proprietary data in any public commits, PRs, or issues"
  - "[ ] No hardcoded credentials or API keys in any committed file"
  - "[ ] DCO or CLA requirements of upstream project satisfied if applicable"
