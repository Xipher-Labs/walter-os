name: Release

# Triggered on push of a v* tag (e.g., v0.3.0), or manually via
# workflow_dispatch with an explicit tag input. The manual trigger lets
# us (re-)run SBOM + checksums + cosign signing for an existing release
# without rolling a new tag — useful when an automated push created the
# release but the security job missed it, or when bumping cosign-installer
# version means re-signing existing tags.
#
# Two jobs run in sequence:
#   1. `release`  — creates the GitHub Release with auto-generated notes
#                   (idempotent: skips if the release already exists).
#   2. `security` — generates CycloneDX SBOM, SHA-256 checksums over the
#                   full release payload, and a cosign keyless OIDC
#                   signature. All artifacts uploaded with --clobber so
#                   workflow_dispatch re-runs cleanly.
#
# Note: this workflow consolidated the previous `release-security.yml`
# into the same workflow file. The split version relied on a
# `release: published` event to chain the two jobs, which GitHub blocks
# when the release was created by GITHUB_TOKEN (recursive-workflow
# protection). Running both jobs in one workflow side-steps that limit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)sign (e.g., v0.3.0). Must already point to a commit; this workflow does not create tags.'
        required: true
        type: string

permissions:
  contents: write   # create release + upload assets
  id-token: write   # cosign OIDC keyless signing
  packages: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      version: ${{ steps.refs.outputs.version }}

    steps:
      - name: Resolve target tag
        id: refs
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$tag" || "${tag:0:1}" != "v" ]]; then
            echo "ERROR: tag must start with v (got: '$tag')" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=${tag}"        >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Target tag: $tag (version $version)"

      - name: Checkout tag (full history for git-cliff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ steps.refs.outputs.tag }}
          fetch-depth: 0  # git-cliff needs full history for changelog generation

      - name: Validate tag matches VERSION
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ steps.refs.outputs.version }}" != "$file_version" ]]; then
            echo "ERROR: tag ${{ steps.refs.outputs.tag }} does not match VERSION (${file_version})"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2
        with:
          tool: git-cliff

      - name: Generate changelog for this release
        run: |
          set -euo pipefail
          # --current: commits since the previous tag up to HEAD of the tag we just checked out.
          git-cliff --current --strip all -o /tmp/release-body.md
          echo "Generated release body:"
          cat /tmp/release-body.md

      - name: Verify changelog body non-empty
        run: |
          set -euo pipefail
          if [ ! -s /tmp/release-body.md ]; then
            echo "ERROR: git-cliff produced empty changelog body" >&2
            exit 1
          fi

      - name: Create GitHub Release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.refs.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving body untouched (use gh release edit if you need to update notes)."
          else
            gh release create "$TAG" \
              --title "Walter-OS $TAG" \
              --notes-file /tmp/release-body.md \
              --draft=false \
              --prerelease=false
            echo "Release created: $TAG"
          fi

  security:
    name: SBOM + checksums + cosign signing
    needs: release
    runs-on: ubuntu-24.04
    outputs:
      slsa-subjects: ${{ steps.slsa-subjects.outputs.hashes }}
    env:
      ASSET_DIR: /tmp/release-assets
      SBOM_FILE: walter-os-${{ needs.release.outputs.tag }}.sbom.cdx.json
      SOURCE_TARBALL: walter-os-${{ needs.release.outputs.tag }}.source.tar.gz
      CHECKSUMS_FILE: checksums.sha256
      TAG: ${{ needs.release.outputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Step A: Pre-create the asset directory deterministically. This
      # MUST happen before any download / sbom step so subsequent steps
      # have a known-good working directory and can fail loudly if files
      # are missing (instead of silently creating one mid-download).
      - name: Prepare asset directory
        run: |
          set -euo pipefail
          mkdir -p "${ASSET_DIR}"

      - name: Build deterministic source archive
        run: |
          set -euo pipefail
          archive_tmp="${RUNNER_TEMP}/${TAG}.source.tar"
          archive_verify_tmp="${RUNNER_TEMP}/${TAG}.source.verify.tar"

          git archive --format=tar --prefix="walter-os-${TAG}/" "${TAG}" > "${archive_tmp}"
          gzip -n -9 < "${archive_tmp}" > "${ASSET_DIR}/${SOURCE_TARBALL}"

          git archive --format=tar --prefix="walter-os-${TAG}/" "${TAG}" > "${archive_verify_tmp}"
          gzip -n -9 < "${archive_verify_tmp}" > "${RUNNER_TEMP}/${SOURCE_TARBALL}.verify"

          cmp "${ASSET_DIR}/${SOURCE_TARBALL}" "${RUNNER_TEMP}/${SOURCE_TARBALL}.verify"
          test -s "${ASSET_DIR}/${SOURCE_TARBALL}"

      # Step B: Generate CycloneDX SBOM directly into the asset directory.
      # We bypass anchore/sbom-action's upload-release-assets feature here
      # because we need the SBOM file on disk in ASSET_DIR for the
      # checksum step. The SBOM is uploaded to the release in Step F.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        # anchore/sbom-action v0.24.0
        with:
          format: cyclonedx-json
          output-file: /tmp/release-assets/walter-os-${{ needs.release.outputs.tag }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          path: .

      - name: Verify SBOM exists and is non-empty
        run: |
          set -euo pipefail
          test -s "${ASSET_DIR}/${SBOM_FILE}"
          echo "SBOM size: $(wc -c < "${ASSET_DIR}/${SBOM_FILE}") bytes"

      - name: Canonicalize SBOM ordering
        run: |
          set -euo pipefail
          tmp="${ASSET_DIR}/${SBOM_FILE}.tmp"
          jq '
            if (.components | type) == "array" then
              .components |= sort_by(.["bom-ref"] // .name // "")
            else . end
            | if (.dependencies | type) == "array" then
              .dependencies |= sort_by(.ref // "")
            else . end
          ' "${ASSET_DIR}/${SBOM_FILE}" > "${tmp}"
          mv "${tmp}" "${ASSET_DIR}/${SBOM_FILE}"

      # Step C: Download EVERY existing release asset (archives, binaries,
      # JSON, anything attached). No --pattern filter — the cosign
      # signature must cover the full release payload. --skip-existing so
      # workflow_dispatch re-runs don't clobber previously-downloaded
      # artifacts.
      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release may have no assets yet on first run — that's fine,
          # SBOM (verified above) ensures asset dir is non-empty.
          gh release download "$TAG" \
            --repo "${RELEASE_REPO}" \
            --dir "${ASSET_DIR}" \
            --skip-existing \
            || echo "no additional assets to download"

      # Step D: Compute SHA-256 checksums over every file in ASSET_DIR,
      # excluding the checksums file itself + previously-uploaded
      # security artifacts (cosign bundle, sig, keyless cert). Sorted
      # for reproducibility.
      - name: Generate SHA-256 checksums for full release payload
        run: |
          set -euo pipefail
          cd "${ASSET_DIR}"
          # Remove any previously-downloaded security artifacts so the
          # re-signed checksums file covers ONLY the canonical payload.
          rm -f "${CHECKSUMS_FILE}" \
                "${CHECKSUMS_FILE}.sig" \
                "${CHECKSUMS_FILE}.pem" \
                "${CHECKSUMS_FILE}.cosign.bundle" \
                walter-os-*.intoto.jsonl
          find . -maxdepth 1 -type f \
            ! -name "${CHECKSUMS_FILE}" \
            ! -name "${CHECKSUMS_FILE}.sig" \
            ! -name "${CHECKSUMS_FILE}.pem" \
            ! -name "*.cosign.bundle" \
            ! -name "*.intoto.jsonl" \
            -exec sha256sum {} + | LC_ALL=C sort > "${CHECKSUMS_FILE}"
          test -s "${CHECKSUMS_FILE}"
          echo "----- checksums.sha256 -----"
          cat "${CHECKSUMS_FILE}"
          echo "----------------------------"

      # Step E: cosign keyless OIDC signing of the checksums file.
      # No long-lived private key — identity is tied to the GitHub
      # Actions OIDC token (ephemeral, auditable via Rekor transparency
      # log).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        # sigstore/cosign-installer v4.1.2

      - name: Sign checksums with cosign keyless OIDC
        run: |
          set -euo pipefail
          test -s "${ASSET_DIR}/${CHECKSUMS_FILE}"
          # Cosign v3+ forces the new-bundle format and treats
          # --output-signature / --output-certificate as deprecated.
          # In practice a second sign-blob invocation that tries to
          # emit those side-by-side errors out with:
          #   "signing checksums.sha256: create bundle file: open :
          #    no such file or directory"
          # because cosign silently demands --bundle even when those
          # flags are set. The canonical artifact going forward is the
          # bundle: a single file carrying signature + Fulcio cert +
          # Rekor entry. We sign once, emit the bundle, and document
          # the bundle as the only first-class verification target.
          # See docs/security/verification.md.
          cosign sign-blob --yes \
            "${ASSET_DIR}/${CHECKSUMS_FILE}" \
            --bundle "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle"
          test -s "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle"

      - name: Generate SLSA provenance subjects
        id: slsa-subjects
        run: |
          set -euo pipefail
          cd "${ASSET_DIR}"
          echo "hashes=$(sha256sum \
            "${SOURCE_TARBALL}" \
            "${SBOM_FILE}" \
            "${CHECKSUMS_FILE}" \
            "${CHECKSUMS_FILE}.cosign.bundle" \
            | base64 -w0)" >> "${GITHUB_OUTPUT}"

      # Step F: Upload SBOM + checksums + bundle. --clobber so
      # workflow_dispatch re-runs overwrite previous artifacts
      # cleanly. The legacy .sig + .pem pair is no longer produced —
      # cosign v3+ forces bundle-only output (see Step E). For tags
      # that previously had legacy `.sig` / `.pem` attached (v0.3.0,
      # the abandoned v0.4.0 attempt), explicitly delete those
      # assets first so the published artifact list matches the
      # workflow's claim (Codex R2 on PR #108: --clobber only
      # replaces files we LIST, not files we omit; stale legacy
      # sidecars would otherwise remain on the release).
      - name: Remove stale legacy assets from existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for stale in \
            "${CHECKSUMS_FILE}.sig" \
            "${CHECKSUMS_FILE}.pem" \
            "walter-os-${TAG}.intoto.jsonl"; do
            # gh release delete-asset exits non-zero if the asset
            # doesn't exist — that's fine for releases that never
            # had it. `|| true` keeps the workflow moving; we log
            # what happened for the audit trail.
            if gh release view "$TAG" --repo "${RELEASE_REPO}" --json assets \
                 --jq ".assets[].name" | grep -qx "$stale"; then
              echo "Deleting stale legacy asset: $stale"
              gh release delete-asset "$TAG" "$stale" \
                --repo "${RELEASE_REPO}" --yes
            else
              echo "No stale $stale on $TAG — nothing to remove."
            fi
          done

      - name: Upload security artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${ASSET_DIR}/${SOURCE_TARBALL}" \
            "${ASSET_DIR}/${SBOM_FILE}" \
            "${ASSET_DIR}/${CHECKSUMS_FILE}" \
            "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle" \
            --repo "${RELEASE_REPO}" \
            --clobber

  provenance:
    name: SLSA provenance
    needs: [release, security]
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generic reusable workflow must use a full semver tag, not a
    # commit SHA; upstream rejects SHA refs for verifier compatibility.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.security.outputs.slsa-subjects }}"
      upload-assets: true
      upload-tag-name: "${{ needs.release.outputs.tag }}"
      provenance-name: "walter-os-${{ needs.release.outputs.tag }}.intoto.jsonl"
