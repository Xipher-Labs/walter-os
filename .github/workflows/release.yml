name: Release

# Triggered on push of a v* tag (e.g., v0.2.0).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required to create GitHub Releases

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # git-cliff needs full history for changelog generation

      - name: Read VERSION
        id: version
        run: |
          version="$(cat VERSION)"
          version="${version//[$'\r\n\t ']/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="${{ steps.version.outputs.version }}"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match VERSION file (${file_version})"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2
        with:
          tool: git-cliff

      - name: Generate changelog for this release
        id: changelog
        run: |
          # Generate changelog body for the current tag only (not the full file).
          # --current: only the commits since the previous tag up to HEAD.
          git-cliff --current --strip all -o /tmp/release-body.md
          echo "Generated release body:"
          cat /tmp/release-body.md

      - name: Verify changelog body non-empty
        run: |
          if [ ! -s /tmp/release-body.md ]; then
            echo "ERROR: git-cliff produced empty changelog body" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Walter-OS ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-body.md \
            --draft=false \
            --prerelease=false
          echo "Release created: ${{ steps.version.outputs.tag }}"
