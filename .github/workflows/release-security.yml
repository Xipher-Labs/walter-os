name: release-security

# Generates SBOM, SHA-256 checksums, and cosign keyless signature for
# every GitHub Release. Triggered alongside the main release workflow
# (PR #47's release.yml) on release publication.
#
# Coverage scope: the signed checksums file (`checksums.sha256`) covers
# the FULL release payload — archives, binaries, AND the SBOM — not just
# JSON assets. Every asset attached to the GitHub Release at the time
# this workflow runs is downloaded with `gh release download` (no pattern
# filter), the SBOM is generated into the same directory, and a single
# sha256sum over every file in that directory is signed with cosign. This
# ensures the cosign signature proves the integrity of the entire release
# payload, not just one file.
#
# Coordination note: PR #47 adds release.yml. This file is additive —
# it attaches security artifacts to the same release event without
# modifying release.yml. When PR #47 merges, these steps should be
# folded into release.yml's job and this file removed to avoid double runs.
#
# Failure semantics: every step propagates errors (no `|| true`). If the
# SBOM is missing, the asset directory is empty, or the checksum file is
# empty, the workflow fails BEFORE cosign signs anything — so we can
# never produce a valid signature over a placeholder file.
#
# All uses: lines are pinned to 40-char commit SHAs per AC-10.
# Requires id-token: write permission for cosign OIDC keyless signing.

on:
  release:
    types: [published]

permissions:
  contents: write    # upload release assets via gh release upload
  id-token: write    # cosign OIDC keyless signing (required)
  packages: read

jobs:
  release-security:
    name: SBOM + checksums + cosign signing
    runs-on: ubuntu-latest
    env:
      ASSET_DIR: /tmp/release-assets
      SBOM_FILE: walter-os-${{ github.ref_name }}.sbom.cdx.json
      CHECKSUMS_FILE: checksums.sha256
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        # actions/checkout v4

      # Step A: Pre-create the asset directory deterministically. This
      # MUST happen before any download / sbom step so subsequent steps
      # have a known-good working directory and can fail loudly if files
      # are missing (instead of silently creating one mid-download).
      - name: Prepare asset directory
        run: |
          set -euo pipefail
          mkdir -p "${ASSET_DIR}"

      # Step B: Generate CycloneDX SBOM directly into the asset directory.
      # We bypass anchore/sbom-action's upload-release-assets feature here
      # because we need the SBOM file on disk in ASSET_DIR for the
      # checksum step. The SBOM is uploaded to the release in Step E
      # together with the other security artifacts.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        # anchore/sbom-action v0.24.0
        with:
          format: cyclonedx-json
          output-file: /tmp/release-assets/walter-os-${{ github.ref_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          path: .

      - name: Verify SBOM exists and is non-empty
        run: |
          set -euo pipefail
          test -s "${ASSET_DIR}/${SBOM_FILE}"
          echo "SBOM size: $(wc -c < "${ASSET_DIR}/${SBOM_FILE}") bytes"

      # Step C: Download EVERY existing release asset (archives, binaries,
      # JSON, anything attached by the main release workflow). No
      # `--pattern` filter — the cosign signature must cover the full
      # release payload, not just JSON. If the release has no assets
      # yet, this is still safe: the SBOM (verified above) ensures the
      # asset directory is non-empty.
      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_REF}" \
            --repo "${RELEASE_REPO}" \
            --dir "${ASSET_DIR}" \
            --skip-existing

      # Step D: Compute SHA-256 checksums over every file in ASSET_DIR,
      # excluding the checksums file itself. Sorted for reproducibility.
      # `find -maxdepth 1` so we don't descend into any sub-directories
      # that gh release download or sbom-action might create.
      - name: Generate SHA-256 checksums for full release payload
        run: |
          set -euo pipefail
          cd "${ASSET_DIR}"
          # shellcheck disable=SC2046
          find . -maxdepth 1 -type f \
            ! -name "${CHECKSUMS_FILE}" \
            ! -name "${CHECKSUMS_FILE}.sig" \
            ! -name "*.cosign.bundle" \
            -exec sha256sum {} + | sort > "${CHECKSUMS_FILE}"
          test -s "${CHECKSUMS_FILE}"
          echo "----- checksums.sha256 -----"
          cat "${CHECKSUMS_FILE}"
          echo "----------------------------"

      # Step E: Cosign keyless OIDC signing of the checksums file.
      # No long-lived private key — identity is tied to the GitHub
      # Actions OIDC token (ephemeral, auditable via Rekor transparency
      # log). The pre-flight `test -s` on checksums.sha256 above ensures
      # we never sign a placeholder.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        # sigstore/cosign-installer v4.1.2

      - name: Sign checksums with cosign keyless OIDC
        run: |
          set -euo pipefail
          test -s "${ASSET_DIR}/${CHECKSUMS_FILE}"
          cosign sign-blob --yes \
            "${ASSET_DIR}/${CHECKSUMS_FILE}" \
            --bundle "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle" \
            --output-signature "${ASSET_DIR}/${CHECKSUMS_FILE}.sig"
          test -s "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle"
          test -s "${ASSET_DIR}/${CHECKSUMS_FILE}.sig"

      # Step F: Upload SBOM + checksums + signature/bundle to the release.
      # `--clobber` so re-runs (manual re-trigger) overwrite cleanly.
      - name: Upload security artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_REF}" \
            "${ASSET_DIR}/${SBOM_FILE}" \
            "${ASSET_DIR}/${CHECKSUMS_FILE}" \
            "${ASSET_DIR}/${CHECKSUMS_FILE}.sig" \
            "${ASSET_DIR}/${CHECKSUMS_FILE}.cosign.bundle" \
            --repo "${RELEASE_REPO}" \
            --clobber
