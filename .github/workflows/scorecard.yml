name: scorecard

# OpenSSF Scorecard: runs weekly and on every push to main.
# Results are uploaded to GitHub code-scanning (Security tab) via SARIF.
# All uses: lines are pinned to 40-char commit SHAs per AC-10.
#
# Required secret: SCORECARD_TOKEN (GitHub PAT with repo scope).
# If not provisioned, the action degrades gracefully (public repos only).

on:
  schedule:
    - cron: '30 1 * * 1'   # weekly, Monday 01:30 UTC
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload Scorecard SARIF to code-scanning
      actions: read            # inspect workflow token permissions
      id-token: write   # for OIDC publish to public Scorecard API
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        # actions/checkout v5
        with:
          persist-credentials: false   # required by scorecard-action

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        # ossf/scorecard-action v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # SCORECARD_TOKEN: GitHub PAT with repo scope.
          # Action degrades gracefully for public repos if not set.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true   # publish to public OpenSSF Scorecard API

      - name: Upload SARIF results to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        # github/codeql-action v4
        with:
          sarif_file: results.sarif
