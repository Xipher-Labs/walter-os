name: Control Tower CI

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/control-tower/**"
  pull_request:
    paths:
      - "apps/control-tower/**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Lint + Typecheck + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm --filter control-tower typecheck

      - name: Lint
        run: pnpm --filter control-tower lint

      - name: Unit tests
        run: pnpm --filter control-tower test:unit

      - name: Build
        run: pnpm --filter control-tower build
        env:
          # Skip missing env vars in CI build
          TAILSCALE_ENFORCE: "false"
          LITELLM_BASE_URL: "http://localhost:4000"
          PLANE_API_URL: "http://localhost:8080"
          GRAFANA_URL: "http://localhost:3000"

  smoke-tests:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm --filter control-tower exec playwright install --with-deps chromium

      - name: Build for smoke tests
        # output:"standalone" + turbopack.root writes server.js under
        # apps/control-tower/.next/standalone/apps/control-tower/.
        run: pnpm --filter control-tower build
        env:
          TAILSCALE_ENFORCE: "false"
          LITELLM_BASE_URL: "http://localhost:4000"
          PLANE_API_URL: "http://localhost:8080"
          GRAFANA_URL: "http://localhost:3000"
          WALTER_COUNCIL_DATA_DIR: "/tmp/test-council-data"
          WALTER_COUNCIL_LOG_DIR: "/tmp/test-council-logs"
          WALTER_CONFIG_DIR: "/tmp/test-walter-config"
          WALTER_VERSION: "0.0.0-test"
          WALTER_UPDATE_AVAILABLE: "0.0.1-test"

      - name: Create test dirs
        run: |
          mkdir -p /tmp/test-council-data /tmp/test-council-logs /tmp/test-walter-config

      - name: Prepare standalone for smoke tests
        # Copy static assets into the standalone tree (not included by Next.js build).
        run: |
          mkdir -p apps/control-tower/.next/standalone/apps/control-tower/.next
          cp -r apps/control-tower/.next/static apps/control-tower/.next/standalone/apps/control-tower/.next/static
          cp -r apps/control-tower/public apps/control-tower/.next/standalone/apps/control-tower/public

      - name: Start mock LiteLLM server
        # The council-chat route handlers fetch LiteLLM server-side (Node.js fetch),
        # so page.route() intercepts don't help. Start a real mock on port 4000.
        run: |
          node apps/control-tower/tests/e2e/mock-litellm.mjs &
          echo $! > /tmp/mock-litellm.pid
          timeout 10 bash -c 'until curl -sf http://localhost:4000/v1/chat/completions -X POST -H "Content-Type: application/json" -d "{}" -o /dev/null 2>/dev/null; do sleep 0.5; done' || true

      - name: Run smoke tests
        run: SKIP_WEBSERVER=false pnpm --filter control-tower test
        env:
          CI: "true"
          TAILSCALE_ENFORCE: "false"
          LITELLM_BASE_URL: "http://localhost:4000"
          PLANE_API_URL: "http://localhost:8080"
          GRAFANA_URL: "http://localhost:3000"
          WALTER_COUNCIL_DATA_DIR: "/tmp/test-council-data"
          WALTER_COUNCIL_LOG_DIR: "/tmp/test-council-logs"
          WALTER_CONFIG_DIR: "/tmp/test-walter-config"
          WALTER_VERSION: "0.0.0-test"
          WALTER_UPDATE_AVAILABLE: "0.0.1-test"

      - name: Upload Playwright traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/control-tower/test-results/
          retention-days: 7
