name: ci

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq shellcheck
          # Excluded codes (real reasoning):
          #   SC2155 - declare-and-assign-separately. Idiomatic in this repo
          #            (`local foo="$(...)"`); masking-return-value risk does
          #            not apply to our usage.
          #   SC1091 - "source path not followed". We source $HOME-relative
          #            files that shellcheck cannot resolve at lint time.
          #   SC1083 - literal `{}` in `@{u}` / `@{0}`. Valid git revision
          #            syntax (upstream tracking), not shell brace expansion.
          #   SC2317 - "command appears unreachable". Info-level false positive
          #            on bash code reached via trap, dynamic dispatch, or
          #            conditional flow that shellcheck's static analysis
          #            can't follow (e.g., heartbeat callbacks, agent state
          #            transitions in run.sh). Disabled globally — real
          #            unreachable code surfaces in code review, not lint.
          #   SC2329 - "function is never invoked". Same dynamic invocation
          #            family as SC2317; traps and sourced libraries trigger
          #            false positives in this repo.
          shellcheck -e SC2155,SC1091,SC1083,SC2317,SC2329 \
            install.sh \
            bin/walter-os \
            scripts/sync.sh \
            scripts/sync-repos.sh \
            scripts/agent-memory-setup.sh \
            scripts/profile-bootstrap.sh \
            scripts/secrets-bootstrap.sh \
            scripts/secrets-identity-init.sh \
            scripts/secrets-keychain-init.sh \
            scripts/wiki.sh \
            scripts/agent-runtime-watchdog.sh \
            scripts/agent-audit-log.sh \
            scripts/agent-secret-redactor.sh \
            scripts/release/reproduce.sh \
            scripts/agents/run.sh \
            scripts/agents/main.sh \
            scripts/agents/plane-pr-sync-webhook.sh \
            scripts/agents/lib/plane.sh \
            scripts/agents/lib/llm.sh \
            scripts/agents/lib/alerts.sh \
            scripts/agents/lib/metrics.sh \
            scripts/agents/lib/spend.sh \
            scripts/walter/lib/audit-chain.sh \
            scripts/walter/lib/feature-state.sh \
            tests/lint-frontmatter.sh \
            hooks/approval-gate.sh \
            hooks/bash-denylist.sh \
            hooks/network-gate.sh \
            hooks/branch-flow-guard.sh \
            hooks/daily-audit-gate.sh \
            hooks/pre-commit-tests.sh \
            setup/walter-host/preflight-check.sh \
            setup/walter-host/recovery/hetzner-break-glass-ssh.sh \
            setup/walter-host/services/openclaw/deploy.sh \
            skills/daily-supply-chain-audit/scripts/audit.sh \
            scripts/walter/subcommands/bridge.sh \
            scripts/walter/subcommands/feature-state.sh \
            scripts/walter/subcommands/release.sh

  frontmatter:
    name: frontmatter lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: ./tests/lint-frontmatter.sh

  cross-references:
    name: cross-reference lint (policy drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -qq jq
      - run: ./tests/lint-cross-references.sh

  ansible-syntax:
    name: ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq ansible
          ansible-galaxy collection install community.general ansible.posix
      - name: Run Walter-VM syntax-check
        working-directory: ansible
        run: ansible-playbook --syntax-check walter-vm.yml -i inventory.yml

  bats:
    name: bats hooks tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # P0-05 hotfix tests rely on `git submodule status` reflecting the
          # real pinned commit (not `-` for uninit). Without recursive init,
          # submodule-pin tests fail in CI even though the pin file is correct.
          submodules: recursive
      - name: Install bats + jq + flock + sqlite3 + python3-yaml + ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq bats jq util-linux sqlite3 python3-yaml ripgrep
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Run hook + agent + wiki + litellm + walter-bridge + cli + walter + oss + audit tests
        run: |
          bats \
            tests/hooks/ \
            tests/agents/ \
            tests/wiki/ \
            tests/litellm/ \
            tests/walter-bridge/ \
            tests/cli/ \
            tests/walter/ \
            tests/oss/ \
            tests/audit/ \
            tests/skills/ \
            tests/cloudflare/ \
            tests/github-actions/ \
            tests/compose/ \
            tests/walter-host/ \
            tests/services/ \
            tests/scripts/secrets-identity-init.bats \
            tests/install/hook-chain-content.bats \
            tests/install/makefile-ci-shellcheck-parity.bats \
            tests/install/escape-helpers.bats \
            tests/install/no-eval-in-helpers.bats \
            tests/install/workflow-pins.bats \
            tests/install/reproducible-builds.bats \
            tests/install/yq-flavor-and-arch.bats

  install-dry-run:
    name: install.sh --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install jq + bats
        run: sudo apt-get update -qq && sudo apt-get install -qq jq bats
      - name: Make scripts executable
        run: chmod +x install.sh hooks/*.sh scripts/*.sh skills/*/scripts/*.sh bin/*
      - name: Run dry-run
        run: ./install.sh --dry-run
      - name: Run Ubuntu install contract smoke test
        run: bats tests/install/platform-contract.bats
