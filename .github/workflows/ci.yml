name: ci

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq shellcheck
          # Excluded codes (real reasoning):
          #   SC2155 - declare-and-assign-separately. Idiomatic in this repo
          #            (`local foo="$(...)"`); masking-return-value risk does
          #            not apply to our usage.
          #   SC1091 - "source path not followed". We source $HOME-relative
          #            files that shellcheck cannot resolve at lint time.
          #   SC1083 - literal `{}` in `@{u}` / `@{0}`. Valid git revision
          #            syntax (upstream tracking), not shell brace expansion.
          #   SC2317 - "command appears unreachable". Info-level false positive
          #            on bash code reached via trap, dynamic dispatch, or
          #            conditional flow that shellcheck's static analysis
          #            can't follow (e.g., heartbeat callbacks, agent state
          #            transitions in run.sh). Disabled globally — real
          #            unreachable code surfaces in code review, not lint.
          #   SC2329 - "function is never invoked". Same dynamic invocation
          #            family as SC2317; traps and sourced libraries trigger
          #            false positives in this repo.
          shellcheck -e SC2155,SC1091,SC1083,SC2317,SC2329 \
            install.sh \
            bin/walter \
            bin/walter-os \
            scripts/sync.sh \
            scripts/sync-repos.sh \
            scripts/agent-memory-setup.sh \
            scripts/profile-bootstrap.sh \
            scripts/secrets-bootstrap.sh \
            scripts/secrets-identity-init.sh \
            scripts/secrets-keychain-init.sh \
            scripts/wiki.sh \
            scripts/agent-runtime-watchdog.sh \
            scripts/agent-audit-log.sh \
            scripts/agent-secret-redactor.sh \
            scripts/release/reproduce.sh \
            scripts/agents/run.sh \
            scripts/agents/main.sh \
            scripts/agents/plane-pr-sync-webhook.sh \
            scripts/agents/lib/plane.sh \
            scripts/agents/lib/llm.sh \
            scripts/agents/lib/alerts.sh \
            scripts/agents/lib/metrics.sh \
            scripts/agents/lib/spend.sh \
            scripts/walter/lib/audit-chain.sh \
            scripts/walter/lib/feature-state.sh \
            tests/lint-frontmatter.sh \
            hooks/approval-gate.sh \
            hooks/bash-denylist.sh \
            hooks/network-gate.sh \
            hooks/branch-flow-guard.sh \
            hooks/daily-audit-gate.sh \
            hooks/pre-commit-tests.sh \
            setup/walter-host/preflight-check.sh \
            setup/walter-host/recovery/hetzner-break-glass-ssh.sh \
            setup/walter-host/services/openclaw/deploy.sh \
            skills/daily-supply-chain-audit/scripts/audit.sh \
            scripts/walter/subcommands/ai.sh \
            scripts/walter/subcommands/bridge.sh \
            scripts/walter/subcommands/providers.sh \
            scripts/walter/subcommands/post-merge-check.sh \
            scripts/walter/subcommands/feature-state.sh \
            scripts/walter/subcommands/release.sh

  frontmatter:
    name: frontmatter lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: ./tests/lint-frontmatter.sh

  cross-references:
    name: cross-reference lint (policy drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -qq jq
      - run: ./tests/lint-cross-references.sh

  ansible-syntax:
    name: ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq ansible
          ansible-galaxy collection install community.general ansible.posix
      - name: Run Walter-VM syntax-check
        working-directory: ansible
        run: ansible-playbook --syntax-check walter-vm.yml -i inventory.yml

  bats-changes:
    name: bats suite change detection
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.filter.outputs.run_all }}
      hooks: ${{ steps.filter.outputs.hooks }}
      agents_and_skills: ${{ steps.filter.outputs.agents_and_skills }}
      wiki_and_observability: ${{ steps.filter.outputs.wiki_and_observability }}
      cli_and_walter: ${{ steps.filter.outputs.cli_and_walter }}
      oss_audit_and_github: ${{ steps.filter.outputs.oss_audit_and_github }}
      compose_and_services: ${{ steps.filter.outputs.compose_and_services }}
      install_contracts: ${{ steps.filter.outputs.install_contracts }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Detect changed Bats suites
        id: filter
        run: |
          set -euo pipefail

          changed="$(mktemp)"
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            git ls-files > "$changed"
            run_all=true
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${GITHUB_SHA}" > "$changed"
            run_all=false
          fi

          # Changes to this workflow can affect every Bats suite and must
          # exercise the full split matrix before the aggregate check passes.
          if grep -Eq '^\.github/workflows/ci\.yml$' "$changed"; then
            run_all=true
          fi

          set_bool() {
            local key="$1"
            local pattern="$2"
            local value=false
            if [[ "$run_all" == "true" ]] || grep -Eq "$pattern" "$changed"; then
              value=true
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          }

          printf 'run_all=%s\n' "$run_all" >> "$GITHUB_OUTPUT"
          set_bool hooks '^(hooks/|tests/hooks/|tests/cloudflare/)'
          set_bool agents_and_skills '^(scripts/agents/|agents/|skills/|tests/agents/|tests/skills/)'
          set_bool wiki_and_observability '^(scripts/wiki\.sh|scripts/wiki/|tests/wiki/|tests/litellm/|tests/walter-bridge/|setup/litellm/|setup/walter-bridge/)'
          set_bool cli_and_walter '^(bin/walter|bin/walter-os|scripts/walter/|tests/cli/|tests/walter/)'
          set_bool oss_audit_and_github '^(tests/oss/|tests/audit/|tests/github-actions/|\.github/workflows/.*\.ya?ml$)'
          set_bool compose_and_services '^(compose\.yml|setup/walter-host/|tests/compose/|tests/walter-host/|tests/services/)'
          set_bool install_contracts '^(install\.sh|Makefile|setup/personal-overlay-init\.sh|scripts/secrets-identity-init\.sh|tests/scripts/secrets-identity-init\.bats|tests/install/(hook-chain-content|makefile-ci-shellcheck-parity|escape-helpers|no-eval-in-helpers|workflow-pins|reproducible-builds|yq-flavor-and-arch)\.bats$)'

  bats-suite:
    name: bats suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: bats-changes
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hooks
            output: hooks
            paths: |
              tests/hooks/
              tests/cloudflare/
          - name: agents-and-skills
            output: agents_and_skills
            paths: |
              tests/agents/
              tests/skills/
          - name: wiki-and-observability
            output: wiki_and_observability
            paths: |
              tests/wiki/
              tests/litellm/
              tests/walter-bridge/
          - name: cli-and-walter
            output: cli_and_walter
            paths: |
              tests/cli/
              tests/walter/
          - name: oss-audit-and-github
            output: oss_audit_and_github
            paths: |
              tests/oss/
              tests/audit/
              tests/github-actions/
          - name: compose-and-services
            output: compose_and_services
            paths: |
              tests/compose/
              tests/walter-host/
              tests/services/
          - name: install-contracts
            output: install_contracts
            paths: |
              tests/scripts/secrets-identity-init.bats
              tests/install/hook-chain-content.bats
              tests/install/makefile-ci-shellcheck-parity.bats
              tests/install/escape-helpers.bats
              tests/install/no-eval-in-helpers.bats
              tests/install/workflow-pins.bats
              tests/install/reproducible-builds.bats
              tests/install/yq-flavor-and-arch.bats
    steps:
      - name: Decide suite execution
        id: decision
        env:
          RUN_ALL: ${{ needs['bats-changes'].outputs.run_all }}
          SUITE_CHANGED: ${{ needs['bats-changes'].outputs[matrix.output] }}
        run: |
          if [[ "$RUN_ALL" == "true" || "$SUITE_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running suite: ${{ matrix.name }}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping suite: ${{ matrix.name }} (no relevant changes)"
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.decision.outputs.run == 'true'
        with:
          # P0-05 hotfix tests rely on `git submodule status` reflecting the
          # real pinned commit (not `-` for uninit). Without recursive init,
          # submodule-pin tests fail in CI even though the pin file is correct.
          submodules: recursive
      - name: Install bats + jq + flock + sqlite3 + python3-yaml + ripgrep
        if: steps.decision.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq bats jq util-linux sqlite3 python3-yaml ripgrep
      - name: Configure git
        if: steps.decision.outputs.run == 'true'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Run Bats suite
        if: steps.decision.outputs.run == 'true'
        env:
          BATS_PATHS: ${{ matrix.paths }}
        run: |
          mapfile -t bats_paths < <(printf '%s\n' "$BATS_PATHS" | sed '/^[[:space:]]*$/d')
          bats "${bats_paths[@]}"

  bats:
    name: bats hooks tests
    runs-on: ubuntu-latest
    needs:
      - bats-changes
      - bats-suite
    if: always()
    steps:
      - name: Check split Bats suites
        run: |
          if [[ "${{ needs['bats-changes'].result }}" != "success" ]]; then
            echo "Bats change detection failed."
            exit 1
          fi
          if [[ "${{ needs['bats-suite'].result }}" != "success" ]]; then
            echo "One or more split Bats suites failed."
            exit 1
          fi
          echo "All split Bats suites passed."

  install-dry-run:
    name: install.sh --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install jq + bats
        run: sudo apt-get update -qq && sudo apt-get install -qq jq bats
      - name: Make scripts executable
        run: chmod +x install.sh hooks/*.sh scripts/*.sh skills/*/scripts/*.sh bin/*
      - name: Run dry-run
        run: ./install.sh --dry-run
      - name: Run Ubuntu install contract smoke test
        run: bats tests/install/platform-contract.bats
