name: secret-scan

# Runs gitleaks on push and pull requests to detect secrets before they
# reach history. Uses .gitleaks.toml at repo root for allowlist configuration.
# All uses: lines are pinned to 40-char commit SHAs per AC-10.

on:
  push:
    branches:
      - main
      - dev
      - staging
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
      - staging

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        # actions/checkout v5
        with:
          fetch-depth: 0   # full history so gitleaks detect covers all commits

      - name: Install pinned gitleaks CLI
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --config=.gitleaks.toml --source=. --redact=100 --no-banner
