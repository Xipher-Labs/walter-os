# git-cliff.toml — changelog configuration for Walter-OS
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Header for the full changelog file.
header = """
# Changelog

All notable changes to Walter-OS. Versioning: [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for each release section. Uses Tera templating.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.scope %} (`{{ commit.scope }}`)\
{% endif %}
{% endfor %}
{% endfor %}\n
"""

# Strip trailing whitespace from changelog body.
trim = true

# Footer appended after all entries.
footer = ""

[git]
# Tag pattern to match version tags.
tag_pattern = "v[0-9]*"

# Parse conventional commits.
conventional_commits = true

# Filter commits that don't match conventional commit format.
filter_unconventional = true

# Process each commit's body as individual messages.
split_commits = false

# Protect breaking changes tag.
protect_breaking_commits = false

# Skip commits matching these patterns.
filter_commits = false

# Sort commits within each group.
sort_commits = "oldest"

# Conventional commit type → changelog group mappings.
# Types not listed here are excluded from the changelog.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^docs", group = "Docs" },
  { message = "^refactor", group = "Refactors" },
  { message = "^perf", group = "Performance" },
  { message = "^security", group = "Security" },
  # chore and test are excluded — they add noise to release notes.
  { message = "^chore", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
]

# Link commits to GitHub (optional — nice for release bodies).
# Override NEXT_PUBLIC_WALTER_REPO_URL or set the commit_url below to match your fork.
# Default points to the upstream OSS repo. Operators maintaining a fork should update this.
# commit_url = "https://github.com/xipher-labs/walter-os/commit/"
