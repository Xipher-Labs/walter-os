# Hermes Agent — self-hostable agentic framework by Nous Research.
# MIT licensed. Docs: https://hermes-agent.nousresearch.com
#
# Profile: --profile hermes-agent (opt-in; not part of core stack)
# URL: hermes.${WALTER_DOMAIN}
# Listens on 127.0.0.1:8642 (gateway API) + 127.0.0.1:9119 (dashboard)
#
# Alternative to OpenClaw. Both runtimes coexist — see
# docs/operational/agent-runtimes-comparison.md for the decision matrix.

services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.5.7
    container_name: hermes-agent
    restart: unless-stopped
    profiles:
      - hermes-agent
    env_file:
      - path: .env
        required: false
    environment:
      # Dashboard + API server
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: "${HERMES_API_SERVER_ENABLED:-false}"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY:-}"
      # LLM routing — defaults to Walter-Bridge (LiteLLM)
      # Override to a direct provider by setting HERMES_LLM_PROVIDER
      # and the corresponding key below.
      HERMES_LLM_PROVIDER: "${HERMES_LLM_PROVIDER:-openai-compatible}"
      OPENAI_BASE_URL: "${LITELLM_BASE_URL:-http://litellm:4000}"
      OPENAI_API_KEY: "${LITELLM_HERMES_KEY}"
      # Skill-learning loop (Curator) — OFF by default for safety.
      # Enable after reading SUGGESTIONS.md §5.
      HERMES_CURATOR_ENABLED: "${HERMES_CURATOR_ENABLED:-false}"
      TZ: "${WALTER_TIMEZONE:-UTC}"
    volumes:
      - hermes_data:/opt/data
    ports:
      - "127.0.0.1:8642:8642"    # Gateway API (OpenAI-compatible)
      - "127.0.0.1:9119:9119"    # Dashboard web UI
    networks:
      - litellm_net
      - hermes_net
    shm_size: "1g"               # Required for browser automation tools
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8642/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  hermes_data:

networks:
  litellm_net:
    external: true
    name: litellm_default
  hermes_net:
    driver: bridge
