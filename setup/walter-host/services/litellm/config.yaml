# LiteLLM proxy config
# Routing strategy: cheap default → escalate explicitly when needed.
# Fallback chain: API key (primary, budget-capped) → subscription proxy → cheap tier.

model_list:
  # ============================================================================
  # PRIMARY (API key, budget-capped per virtual key)
  # ============================================================================

  # Cheap tier — default for scrapers, summarization, simple tasks.
  - model_name: cheap
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Default tier — mid-complexity coding, content, OpenClaw routine.
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt
    litellm_params:
      model: gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  # High tier — hard reasoning, security review, complex refactor.
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  # ============================================================================
  # FALLBACK (operator's personal subscriptions via internal routers)
  # See setup/walter-host/services/subscription-router-pattern/SUGGESTIONS.md.
  # ============================================================================

  # chatgpt-codex-router exposes the operator's ChatGPT/Codex session as an
  # OpenAI-compatible API.
  - model_name: codex-sub
    litellm_params:
      model: openai/gpt-5
      api_base: http://chatgpt-codex-router:1456/v1
      api_key: os.environ/CCR_APIKEY

  - model_name: codex-sub-think
    litellm_params:
      model: openai/o4-mini
      api_base: http://chatgpt-codex-router:1456/v1
      api_key: os.environ/CCR_APIKEY

  # claude-sub-router exposes the operator's Claude subscription as an
  # OpenAI-compatible API.
  - model_name: claude-sub
    litellm_params:
      model: openai/sonnet
      api_base: http://claude-sub-router:1457/v1
      api_key: os.environ/CSR_APIKEY

  - model_name: claude-sub-opus
    litellm_params:
      model: openai/opus
      api_base: http://claude-sub-router:1457/v1
      api_key: os.environ/CSR_APIKEY

  # gemini-sub-router exposes the operator's Gemini subscription as an
  # OpenAI-compatible API.
  - model_name: gemini-sub
    litellm_params:
      model: openai/gemini-2.5-pro
      api_base: http://gemini-sub-router:1458/v1
      api_key: os.environ/GSR_APIKEY

  - model_name: gemini-sub-flash
    litellm_params:
      model: openai/gemini-2.5-flash
      api_base: http://gemini-sub-router:1458/v1
      api_key: os.environ/GSR_APIKEY

  # ============================================================================
  # OPENROUTER (single API key fronts ~300 models — used as last-resort fallback)
  # ============================================================================
  # OpenRouter exposes open-weight models (DeepSeek, Qwen, Llama, Mistral,
  # Grok) plus BYOK pass-through to Anthropic / OpenAI / Google under one
  # billing surface. Wired into the fallback chain below so that an
  # Anthropic 429 / budget-cap cascades through claude-sub → openrouter/claude
  # before giving up. Spend tracked centrally by ai-spend-tripwire.
  #
  # If OPENROUTER_API_KEY is unset at runtime, LiteLLM still loads the
  # config but these routes will error on use — the fallback chain skips
  # past them. Leave unset to disable OpenRouter routing entirely.
  #
  # Model identifiers below are OpenRouter's canonical slugs. Re-check at
  # https://openrouter.ai/models before bumping; OpenRouter retires legacy
  # slugs from time to time.

  # BYOK Claude through OpenRouter — last-resort failover when both the
  # Anthropic API key and the claude-code-router subscription proxy are
  # down or budget-exhausted.
  - model_name: openrouter/claude
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY

  # Open-weight tier — useful when API-keyed primaries are budget-capped
  # and operators want cheap, unmetered (per-OpenRouter-credit) calls.
  - model_name: openrouter/deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v3
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/qwen
    litellm_params:
      model: openrouter/qwen/qwen3-72b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/mistral
    litellm_params:
      model: openrouter/mistralai/mistral-large-2411
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/grok
    litellm_params:
      model: openrouter/x-ai/grok-4
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Vision / image gen (nanobanana skill uses this) ----
  - model_name: nanobanana
    litellm_params:
      model: gemini/gemini-2.5-flash-image
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: os.environ/REDIS_HOST
  # Fallback chain: when budget cap (or upstream rate-limit) hits primary,
  # LiteLLM tries the next entry. Order = preference.
  fallbacks:
    # Opus path: API → claude-sub-opus → openrouter/claude-opus → claude-sub → sonnet
    - opus: ["claude-sub-opus", "openrouter/claude-opus", "claude-sub", "sonnet"]
    # Sonnet path: API → claude-sub → openrouter/claude → haiku
    - sonnet: ["claude-sub", "openrouter/claude", "haiku"]
    # GPT path: API → Codex subscription → sonnet (cross-provider fallback) → openrouter/deepseek (open-weight)
    - gpt: ["codex-sub", "sonnet", "haiku", "openrouter/deepseek"]
    # Haiku tier: API → cheap (Gemini Flash) → gemini-sub-flash → openrouter/qwen
    - haiku: ["cheap", "gemini-sub-flash", "openrouter/qwen"]
  # Treat 429 + 401 from any upstream as "fall over" trigger
  num_retries: 2
  request_timeout: 60
  retry_after: 5

litellm_settings:
  drop_params: True
  set_verbose: False
  cache: True
  cache_params:
    type: local

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  ui_access_mode: admin
  # Alerting handled by Grafana (provisioned Telegram contact point) — keeping
  # it out of LiteLLM avoids requiring an undefined webhook URL on boot.
