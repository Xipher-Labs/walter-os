# LiteLLM gateway — unified OpenAI-compatible API in front of Anthropic, OpenAI,
# Gemini, Ollama (local later), with virtual keys for per-client attribution
# and Postgres for usage tracking.

x-walter-limits:
  litellm: &limits-litellm
    mem_limit: "${LITELLM_MEM_LIMIT:-1024m}"
    mem_reservation: "${LITELLM_MEM_RESERVATION:-512m}"
    cpus: "${LITELLM_CPUS:-2.0}"
    pids_limit: 512
  litellm-db: &limits-litellm-db
    mem_limit: "${LITELLM_DB_MEM_LIMIT:-1024m}"
    mem_reservation: "${LITELLM_DB_MEM_RESERVATION:-512m}"
    cpus: "${LITELLM_DB_CPUS:-1.0}"
    pids_limit: 256
  litellm-pgbouncer: &limits-litellm-pgbouncer
    mem_limit: "${LITELLM_PGBOUNCER_MEM_LIMIT:-128m}"
    mem_reservation: "${LITELLM_PGBOUNCER_MEM_RESERVATION:-64m}"
    cpus: "${LITELLM_PGBOUNCER_CPUS:-0.25}"
    pids_limit: 128

services:
  litellm:
    <<: *limits-litellm
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # Bound the Prisma/quaint pool + fail fast. Without these the pool defaults
      # to ~num_cpus*2+1 PER worker (16 vCPU box × --num_workers 2 ≈ 40+ backends,
      # confirmed 43 live on 2026-06-06), so a reconnect storm during a
      # crash-loop can exhaust litellm-db backend slots → "too many clients"
      # → undetected 4-day outage (ADR-0027, Incident 1). connection_limit=10 caps
      # client demand to ~20 backends; pool_timeout/connect_timeout turn a
      # saturated pool into a fast visible error instead of a silent hang.
      DATABASE_URL: "${LITELLM_DATABASE_URL:-postgresql://litellm:${LITELLM_DB_PASS}@litellm-db:5432/litellm?connection_limit=10&pool_timeout=10&connect_timeout=10}"
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: "${WALTER_INITIAL_USER:-admin}"
      UI_PASSWORD: ${LITELLM_UI_PASS}
      # API keys for upstream providers — populate from secrets.env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # OpenRouter — single API key fronts ~300 models (DeepSeek, Qwen,
      # Mistral, Llama, Grok, etc.) and BYOK pass-through to Anthropic /
      # OpenAI / Google. Used as last-resort fallback when primaries are
      # rate-limited or budget-capped. Leave unset to skip openrouter/*
      # routes; LiteLLM will exclude them at runtime.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # claude-sub aliases (route via claude-code-router): config.yaml resolves
      # `api_key: os.environ/CCR_APIKEY` for `claude-sub` + `claude-sub-opus`.
      # Pass the same key the router uses so LiteLLM can authenticate.
      CCR_APIKEY: ${CCR_APIKEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    # Functional liveliness probe — flips the container (unhealthy) the moment
    # LiteLLM stops serving, instead of the misleading "Up 4 days" during a
    # crash-loop (ADR-0027, Incident 1). start_period=120s: confirmed cold-start
    # to /health/readiness is ~95s (Prisma migrate + 2 workers) on 2026-06-06,
    # so the probe must not mark it unhealthy before then.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  litellm-db:
    <<: *limits-litellm-db
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - superuser_reserved_connections=5
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASS}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U litellm -d litellm -v ON_ERROR_STOP=1 -Atqc
          "SELECT CASE WHEN count(*) < ((current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int) * 9 / 10) THEN 1 ELSE 0 END FROM pg_stat_activity;"
          | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-pgbouncer:
    <<: *limits-litellm-pgbouncer
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: litellm-pgbouncer
    restart: unless-stopped
    profiles: ["pgbouncer"]
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      DB_USER: litellm
      DB_PASSWORD: ${LITELLM_DB_PASS}
      DB_HOST: litellm-db
      DB_PORT: 5432
      DB_NAME: litellm
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "${LITELLM_PGBOUNCER_MAX_CLIENT_CONN:-200}"
      DEFAULT_POOL_SIZE: "${LITELLM_PGBOUNCER_POOL_SIZE:-20}"
      RESERVE_POOL_SIZE: "${LITELLM_PGBOUNCER_RESERVE_POOL_SIZE:-5}"
      MAX_DB_CONNECTIONS: "${LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS:-25}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  litellm-db-data:
