# Synapse — Matrix homeserver — base of self-hosted Beeper bridges.
# https://element-hq.github.io/synapse/
#
# URLs:
#   matrix.${WALTER_DOMAIN}  → Synapse (federation + clients) at port 8008
#   chat-matrix.${WALTER_DOMAIN}  → Element web client at port 8081
#
# Federation disabled by default (this is a private homeserver). Bridges
# (mautrix-*) join via internal docker network.

services:
  synapse:
    image: matrixdotorg/synapse:v1.119.0
    container_name: synapse
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${WALTER_DOMAIN}
      SYNAPSE_REPORT_STATS: "no"
      UID: "991"
      GID: "991"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - synapse_data:/data
      - ./config:/data/config:ro
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      synapse-db:
        condition: service_healthy
    networks:
      - synapse_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health | grep -q OK || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  synapse-db:
    image: postgres:16-alpine
    container_name: synapse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASS}
      # Critical: Synapse requires this exact locale config
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_pg:/var/lib/postgresql/data
    networks:
      - synapse_net
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT CASE WHEN count(*) < (current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int) THEN 1 ELSE 0 END FROM pg_stat_activity\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  element-web:
    image: vectorim/element-web:v1.11.95
    container_name: element-web
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - synapse_net
    # Override the image's default HEALTHCHECK — its `wget --retry-connrefused`
    # uses a flag BusyBox wget doesn't support, so the container reports
    # unhealthy forever even though nginx serves fine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/config.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  synapse_data:
  synapse_pg:

networks:
  synapse_net:
    driver: bridge
