# systemd drop-in to harden the cloudflared tunnel against crashes.
#
# Install on the VM:
#   sudo mkdir -p /etc/systemd/system/cloudflared.service.d
#   sudo cp restart-hardening.conf /etc/systemd/system/cloudflared.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart cloudflared
#
# This is the FIRST line of defense: if the cloudflared PROCESS dies, systemd
# restarts it automatically. It does NOT cover the "process alive but tunnel
# unregistered" case (the 2026-06-06 outage) — ai-stack-watchdog.sh handles
# that by probing /ready (or scanning logs) and restarting on a wedged tunnel.
#
# If the cloudflared service already exposes --metrics, the watchdog can probe
# /ready cheaply. This drop-in does not add --metrics; keep the existing value
# and set CLOUDFLARED_METRICS in /etc/walter-vm/alerting.env to match.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
