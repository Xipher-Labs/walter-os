# chatgpt-codex-router-solx — second ChatGPT account behind the same bridge.
#
# Compose override layered on top of docker-compose.yml. It runs the same
# image/server as chatgpt-codex-router but bind-mounts a DIFFERENT Codex home
# (a second ChatGPT subscription), so LiteLLM can load-balance and fail over
# between two accounts. When one account hits its weekly usage limit, LiteLLM
# cools that deployment down (router_settings.allowed_fails / cooldown_time)
# and keeps serving from the other.
#
# Enable it by adding to the router's .env (see .env.template):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.solx.yml
#   CCR_SOLX_APIKEY=<openssl rand -hex 32>
#
# LiteLLM reaches it at http://chatgpt-codex-router-solx:1456/v1 with
# api_key os.environ/CCR_SOLX_APIKEY (setup/walter-host/services/litellm/).
# One-time login:
#   docker exec -it chatgpt-codex-router-solx codex login
# See RUNBOOK.md "Multiple ChatGPT accounts".

services:
  chatgpt-codex-router-solx:
    mem_limit: "${CHATGPT_CODEX_ROUTER_SOLX_MEM_LIMIT:-512m}"
    mem_reservation: "${CHATGPT_CODEX_ROUTER_SOLX_MEM_RESERVATION:-256m}"
    cpus: "${CHATGPT_CODEX_ROUTER_SOLX_CPUS:-1.0}"
    pids_limit: "${CHATGPT_CODEX_ROUTER_SOLX_PIDS_LIMIT:-256}"
    build: .
    container_name: chatgpt-codex-router-solx
    restart: unless-stopped
    environment:
      PORT: "1456"
      HOME: /home/appuser
      # Distinct key from the primary router's CCR_APIKEY.
      CCR_APIKEY: "${CCR_SOLX_APIKEY:?CCR_SOLX_APIKEY must be set — generate with: openssl rand -hex 32}"
      MODEL_MAP_JSON: "${MODEL_MAP_JSON:-}"
      ROUTER_STARTUP_MODEL_PROBE: "${ROUTER_STARTUP_MODEL_PROBE:-1}"
      ROUTER_STARTUP_MODEL_PROBE_TIMEOUT_MS: "${ROUTER_STARTUP_MODEL_PROBE_TIMEOUT_MS:-240000}"
      ROUTER_STARTUP_MODEL_PROBE_PROMPT: "${ROUTER_STARTUP_MODEL_PROBE_PROMPT:-Reply with exactly: ok}"
    volumes:
      # Second account's Codex home. Never point this at the primary ~/.codex:
      # two routers sharing one auth.json race on token refresh.
      - ${CODEX_SOLX_HOME:-${HOME}/.codex-solx}:/home/appuser/.codex:rw
    ports:
      # Localhost-only debugging port (ports.tsv: 1459 → 1456).
      - "127.0.0.1:1459:1456"
    networks:
      - litellm_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1456/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

networks:
  litellm_net:
    external: true
    name: litellm_default
