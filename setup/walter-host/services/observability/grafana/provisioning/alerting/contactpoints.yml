apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-walter-bot
    receivers:
      - uid: telegram_walter_bot
        type: telegram
        settings:
          # NOTE: bottoken + chatid are templated from env vars at container
          # boot. Grafana parses ${VAR} from env. See compose.yml for env wiring.
          bottoken: ${WALTER_TELEGRAM_BOT_TOKEN}
          chatid: ${WALTER_TELEGRAM_CHAT_ID}
          parse_mode: Markdown
          message: |
            🚨 *Grafana Alert* — {{ .CommonLabels.alertname }}
            Severity: {{ .CommonLabels.severity }}
            Summary: {{ .CommonAnnotations.summary }}
            {{ range .Alerts }}
            • {{ .Labels.instance }}: {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: telegram-walter-bot
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
