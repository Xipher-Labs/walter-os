global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    walter_vm: walter-os
    environment: prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Service-specific endpoints (most expose /metrics if enabled)
  - job_name: n8n
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["n8n:5678"]
    # n8n metrics endpoint requires N8N_METRICS=true — add to its env later

  - job_name: litellm
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: cloudflared
    metrics_path: /metrics
    scrape_interval: 30s
    # cloudflared on the host (not container) — requires --metrics flag
    static_configs:
      - targets: ["172.17.0.1:38765"]
        # bridge gateway IP; --metrics 127.0.0.1:38765 in cloudflared config
