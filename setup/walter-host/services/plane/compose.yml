# Plane self-host with pre-built images from Docker Hub
# Tag: stable (= v1.3.0 as of 2026-04-06)
#
# Listens on 127.0.0.1:8090 — cloudflared proxies plane.${WALTER_DOMAIN} here.

x-plane-app-env: &plane-app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
    REDIS_URL: redis://plane-redis:6379/
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST}
    USE_MINIO: "1"

services:
  web:
    image: makeplane/plane-frontend@sha256:20d83ae9257415593a0522b607b3827dde429d8511b1bcf97f6313e55fc60c09
    container_name: plane-web
    restart: always
    <<: *plane-app-env
    depends_on:
      - api

  admin:
    image: makeplane/plane-admin@sha256:82a2b82f34a24b95e2b663327c34d32828d24680aef258f901ebc0adc27542ea
    container_name: plane-admin
    restart: always
    <<: *plane-app-env
    depends_on:
      - api

  space:
    image: makeplane/plane-space@sha256:d03aa511c5292b6feb3119fc8d399e0e2f8c2e5b308c076779691cff54bd3451
    container_name: plane-space
    restart: always
    <<: *plane-app-env
    depends_on:
      - api

  live:
    image: makeplane/plane-live@sha256:d9ce8992425d9724ccd972f532dd46476b64c53c9e886f0a4eda8915f8b700d2
    container_name: plane-live
    restart: always
    <<: *plane-app-env
    depends_on:
      - api

  api:
    image: makeplane/plane-backend@sha256:2da6972c81a0ac797c9d04db448aa5985e1257fc5d9724b165e9c07791e8cc64
    container_name: plane-api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    <<: *plane-app-env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    image: makeplane/plane-backend@sha256:2da6972c81a0ac797c9d04db448aa5985e1257fc5d9724b165e9c07791e8cc64
    container_name: plane-worker
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    <<: *plane-app-env
    depends_on:
      - api

  beat-worker:
    image: makeplane/plane-backend@sha256:2da6972c81a0ac797c9d04db448aa5985e1257fc5d9724b165e9c07791e8cc64
    container_name: plane-beat-worker
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    <<: *plane-app-env
    depends_on:
      - api

  migrator:
    image: makeplane/plane-backend@sha256:2da6972c81a0ac797c9d04db448aa5985e1257fc5d9724b165e9c07791e8cc64
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    <<: *plane-app-env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  plane-db:
    image: postgres:16-alpine
    container_name: plane-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: redis:7-alpine
    container_name: plane-redis
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3-management-alpine
    container_name: plane-mq
    restart: always
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: plane-minio
    restart: always
    command: server /export --console-address ":9090"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - uploads:/export

  proxy:
    image: makeplane/plane-proxy@sha256:6657012b40903af11e88f7041168a3e2f11334ffc4110a245b7925545906e19f
    container_name: plane-proxy
    restart: always
    ports:
      - "127.0.0.1:8090:80"
    env_file: .env
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - admin
      - space
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
