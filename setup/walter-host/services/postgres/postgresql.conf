# Walter-VM — postgresql.conf additions for pg_cron + pg_partman
#
# This file overrides the defaults from the base postgres:17 image.
# pg_cron MUST be listed in shared_preload_libraries before server starts.
# pg_partman uses BGW (background worker) — also requires preload.
#
# Refs: docs/specs/devrel-analytics-stack.md (V-prereq-6)

# pg_cron: needed for scheduled SQL jobs (materialized view refresh, partition maintenance)
# pg_partman_bgw: background worker for automatic partition creation
shared_preload_libraries = 'pg_cron,pg_partman_bgw'

# pg_cron: which DB runs the cron jobs (must match POSTGRES_DB or 'postgres')
# For walter_devrel_analytics, we run cron jobs in the analytics DB.
cron.database_name = 'walter_devrel_analytics'

# pg_partman background worker settings
pg_partman_bgw.interval = 3600          # check partitions every hour
pg_partman_bgw.role = 'postgres'
pg_partman_bgw.dbname = 'walter_devrel_analytics'

# Logging — enough to debug ingestion issues without flooding
log_min_duration_statement = 5000       # log queries taking >5s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
