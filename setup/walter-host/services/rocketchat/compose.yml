# Rocket.Chat — open-source Slack alternative.
# https://rocket.chat
# URL: chat.${WALTER_DOMAIN} (CF Tunnel + Access)
# Mobile clients: iOS + Android (free).

services:
  rocketchat:
    image: rocket.chat:7.10.4
    container_name: rocketchat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"   # 3001 to avoid conflict with Forgejo
    environment:
      ROOT_URL: https://chat.${WALTER_DOMAIN}
      MONGO_URL: mongodb://rocketchat-mongo:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://rocketchat-mongo:27017/local?replicaSet=rs0
      PORT: 3000
      DEPLOY_METHOD: docker
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      MAIL_URL: smtp://resend:${RESEND_API_KEY}@smtp.resend.com:587
      Accounts_AllowEmailNotifications: "true"
      From_Email: onboarding@resend.dev
    depends_on:
      rocketchat-mongo:
        condition: service_healthy
    # rocket.chat image has no curl/wget — use node's http (Meteor app, node
    # is always present). /api/info returns 200 with version info if alive.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/info',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  rocketchat-mongo:
    image: mongo:7-jammy
    container_name: rocketchat-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--oplogSize", "128"]
    volumes:
      - rocketchat_mongo:/data/db
      - rocketchat_mongo_config:/data/configdb
    healthcheck:
      test: |
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'rocketchat-mongo:27017'}]}) }" | mongosh --quiet
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 30s

volumes:
  rocketchat_mongo:
  rocketchat_mongo_config:
