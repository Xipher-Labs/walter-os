# n8n — workflow automation engine for Walter-VM
#
# URL: https://n8n.${WALTER_DOMAIN} (behind CF Tunnel + CF Access)
# Listens on 127.0.0.1:5678 — cloudflared proxies to it.
#
# Persistence: named volumes n8n_data + n8n_pg.
# Secrets: from .env (NOT hardcoded). The .env file lives at this directory
# and is gitignored. Generated by deploy.sh on first run.
#
# To bring up:   docker compose --env-file .env up -d
# To upgrade:    docker compose pull && docker compose up -d
# To inspect:    docker compose logs -f n8n
# To kill:       docker compose down       (KEEPS DATA)
#                docker compose down -v    (DELETES DATA — careful)

services:
  n8n:
    image: n8nio/n8n:2.18.7
    container_name: n8n
    restart: unless-stopped
    environment:
      # ---- Server / URL ----
      N8N_HOST: ${N8N_HOST:-n8n.${WALTER_DOMAIN}}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.${WALTER_DOMAIN}}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST:-n8n.${WALTER_DOMAIN}}/
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      TZ: ${N8N_TIMEZONE:-UTC}

      # ---- DB (Postgres) ----
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-pg
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_PG_PASS}

      # ---- Encryption (encrypts saved credentials) ----
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # ---- Auth ----
      # We disable n8n's basic auth because Cloudflare Access in front of
      # the tunnel handles auth (Google IdP, allow @${WALTER_DOMAIN}). If you remove
      # CF Access, re-enable basic auth or set up n8n's user management.
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_USER_MANAGEMENT_DISABLED: "false"

      # ---- Trust proxy (we are behind cloudflared) ----
      N8N_PROXY_HOPS: 1

      # ---- Telemetry / diagnostics off (privacy) ----
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "true"

      # ---- Execution data retention ----
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720      # hours = 30 days
      EXECUTIONS_DATA_PRUNE_TIMEOUT: 3600

      # ---- Misc ----
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount-in-and-out files dir for workflows that read/write local
      # files. Bind-mounted to host so backups / restic can grab it.
      - ./files:/files
    depends_on:
      n8n-pg:
        condition: service_healthy
    networks: [n8n_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5

  n8n-pg:
    image: postgres:16-alpine
    container_name: n8n-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_PG_PASS}
    volumes:
      - n8n_pg:/var/lib/postgresql/data
    networks: [n8n_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  n8n_pg:

networks:
  n8n_net:
    driver: bridge
