# Optional ntfy notification profile for Walter-VM.
# Start explicitly with:
#   docker compose --profile notifications up -d

services:
  ntfy:
    image: binwiederhier/ntfy:v2.23.0
    container_name: ntfy
    restart: unless-stopped
    profiles: [ntfy, notifications]
    command:
      - serve
      - --config
      - /etc/ntfy/server.yml
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    expose:
      - "80"
    networks:
      - ntfy_net

volumes:
  ntfy_data:
  ntfy_cache:

networks:
  ntfy_net:
    external: true
    name: ntfy_net
