# Metabase — BI / dashboards for Walter-VM
# Deployed 2026-05-13 with Infisical sidecar pattern.
# URL: https://metabase.xipherlabs.xyz (CF Tunnel + CF Access)
# Listens on 127.0.0.1:3051 (avoids 3001 = uptime-kuma)

services:
  metabase-secrets:
    image: infisical/cli:0.43.84
    container_name: metabase-secrets
    restart: "no"
    volumes:
      - /etc/walter-os/infisical-identity:/etc/identity.env:ro
      - metabase_secrets:/secrets-out
    entrypoint:
      - sh
      - -c
      - |
        set -e
        set -a; . /etc/identity.env; set +a
        TOK=$$(infisical login --method=universal-auth \
          --client-id="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
          --client-secret="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
          --domain="$$INFISICAL_API_URL" --plain --silent 2>/dev/null | tail -1)
        [ -z "$$TOK" ] && { echo "metabase-secrets: login failed" >&2; exit 1; }
        INFISICAL_TOKEN="$$TOK" infisical export \
          --projectId="$$INFISICAL_PROJECT_ID" \
          --domain="$$INFISICAL_API_URL" \
          --env=prod --path=/metabase --format=dotenv > /secrets-out/metabase.env.tmp
        [ -s /secrets-out/metabase.env.tmp ] || { echo "metabase-secrets: empty export" >&2; exit 1; }
        chmod 644 /secrets-out/metabase.env.tmp
        mv /secrets-out/metabase.env.tmp /secrets-out/metabase.env
        echo "metabase-secrets: published $$(wc -l < /secrets-out/metabase.env) secrets"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  metabase:
    image: metabase/metabase:v0.53.11
    container_name: metabase
    restart: unless-stopped
    depends_on:
      metabase-secrets:
        condition: service_completed_successfully
      metabase-pg:
        condition: service_healthy
      social-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:3051:3000"
    volumes:
      - metabase_data:/metabase-data
      - metabase_secrets:/run/secrets:ro
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_HOST: metabase-pg
      MB_SITE_URL: https://metabase.xipherlabs.xyz
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
      MB_ENABLE_EMBEDDING: "false"
      MB_PASSWORD_COMPLEXITY: strong
      JAVA_OPTS: "-Xmx1024m"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        [ -s /run/secrets/metabase.env ] || { echo "metabase: secrets missing" >&2; exit 1; }
        set -a; . /run/secrets/metabase.env; set +a
        export MB_DB_PASS="$$METABASE_DB_PASS"
        export MB_ENCRYPTION_SECRET_KEY="$$METABASE_ENCRYPTION_KEY"
        exec /app/run_metabase.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  metabase-pg:
    image: postgres:16-alpine
    container_name: metabase-pg
    restart: unless-stopped
    depends_on:
      metabase-secrets:
        condition: service_completed_successfully
    volumes:
      - metabase_pg:/var/lib/postgresql/data
      - metabase_secrets:/run/secrets:ro
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabase
    entrypoint:
      - sh
      - -c
      - |
        set -e
        [ -s /run/secrets/metabase.env ] || { echo "metabase-pg: secrets missing" >&2; exit 1; }
        set -a; . /run/secrets/metabase.env; set +a
        export POSTGRES_PASSWORD="$$METABASE_DB_PASS"
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  social-pg:
    image: postgres:16-alpine
    container_name: social-pg
    restart: unless-stopped
    depends_on:
      metabase-secrets:
        condition: service_completed_successfully
    volumes:
      - social_pg:/var/lib/postgresql/data
      - metabase_secrets:/run/secrets:ro
    environment:
      POSTGRES_USER: social
      POSTGRES_DB: social
    ports:
      - "127.0.0.1:5433:5432"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        [ -s /run/secrets/metabase.env ] || { echo "social-pg: secrets missing" >&2; exit 1; }
        set -a; . /run/secrets/metabase.env; set +a
        export POSTGRES_PASSWORD="$$SOCIAL_PG_PASS"
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  metabase_data:
  metabase_pg:
  social_pg:
  metabase_secrets:
