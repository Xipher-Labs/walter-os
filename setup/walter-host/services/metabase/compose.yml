# Metabase — BI / dashboards for Walter-VM
# Harmonized from feat/social-pipeline branch (2026-05-12).
#
# URL: https://metabase.${WALTER_DOMAIN} (behind Caddy reverse-proxy).
# Listens on 127.0.0.1:3001 — Caddy proxies externally.
#
# Two databases:
#   - metabase-pg (Metabase app metadata: questions, dashboards, users)
#   - social-pg   (analytics DB that n8n writes to; Metabase reads from it)
#
# Keeping the two Postgres instances separate allows independent
# backup/restore and avoids mixing app metadata with analytics data.
# Additional data producers (Plausible, PostHog export) can be added to
# social-pg without polluting Metabase's own DB.
#
# Persistence: named volumes metabase_data + metabase_pg + social_pg.

services:
  metabase:
    image: metabase/metabase:v0.53.11
    container_name: metabase
    restart: unless-stopped
    depends_on:
      metabase-pg:
        condition: service_healthy
      social-pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASS:?required}
      MB_DB_HOST: metabase-pg
      MB_SITE_URL: https://metabase.${WALTER_DOMAIN}
      JAVA_TIMEZONE: ${WALTER_TIMEZONE:-UTC}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?required}
      # Embedding disabled — internal use only via CF Access or Tailscale
      MB_ENABLE_EMBEDDING: "false"
      MB_PASSWORD_COMPLEXITY: strong
      # Memory tuning — adjust JAVA_OPTS for smaller VMs
      JAVA_OPTS: "-Xmx1024m"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  metabase-pg:
    image: postgres:16-alpine
    container_name: metabase-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASS:?required}
      POSTGRES_DB: metabase
    volumes:
      - metabase_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT CASE WHEN count(*) < (current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int) THEN 1 ELSE 0 END FROM pg_stat_activity\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics DB — n8n writes social metrics here, Metabase reads.
  social-pg:
    image: postgres:16-alpine
    container_name: social-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${SOCIAL_PG_PASS:?required}
      POSTGRES_DB: social
    volumes:
      - social_pg:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    ports:
      # Expose on loopback only — Metabase and n8n connect via Docker network
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT CASE WHEN count(*) < (current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int) THEN 1 ELSE 0 END FROM pg_stat_activity\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  metabase_data:
    name: metabase_data
  metabase_pg:
    name: metabase_pg
  social_pg:
    name: social_pg
