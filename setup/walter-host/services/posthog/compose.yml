# PostHog — self-hosted analytics (hobby stack)
# Vendored from operator VM /opt/posthog/docker-compose.yml (2026-05-12).
# 27+ services. See compose.override.yml for operator-specific overrides.
# Refs: docs/specs/devrel-analytics-stack.md
#
# Required env vars (in .env.template):
#   WALTER_DOMAIN    — your domain (e.g. example.com); posthog served at posthog.${WALTER_DOMAIN}
#   POSTHOG_SECRET   — random secret key (openssl rand -hex 32)
#   POSTHOG_DB_PASS  — postgres password for posthog user (openssl rand -hex 16)
#   ENCRYPTION_SALT_KEYS — Fernet key (openssl rand -hex 16)
#   POSTHOG_APP_TAG  — Docker image tag (e.g. master; use a pinned digest for production)
#   REGISTRY_URL     — PostHog image registry prefix (ghcr.io/posthog/posthog)
#
# Note: This compose uses `extends:` which requires Docker Compose plugin v2.20+.
# All PostHog services share networks declared in posthog-base (docker-compose.base.yml).
# The base file is cloned from https://github.com/PostHog/posthog at deploy time.
#
# SeaweedFS note: The posthog_seaweedfs volume is shared with the standalone
# SeaweedFS service at setup/walter-host/services/seaweedfs/compose.yml. When running
# PostHog standalone, seaweedfs starts here. When sharing with the Walter-OS
# root compose, use the existing seaweedfs service.

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

services:
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
        mem_limit: "${POSTHOG_DB_MEM_LIMIT:-2g}"
        mem_reservation: "${POSTHOG_DB_MEM_RESERVATION:-1g}"
        cpus: "${POSTHOG_DB_CPUS:-1.5}"
        pids_limit: "${POSTHOG_DB_PIDS_LIMIT:-512}"
        logging: *default-logging
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis7:
        extends:
            file: docker-compose.base.yml
            service: redis7
        mem_limit: "${POSTHOG_REDIS7_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_REDIS7_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_REDIS7_CPUS:-0.75}"
        pids_limit: "${POSTHOG_REDIS7_PIDS_LIMIT:-256}"
        logging: *default-logging
        volumes:
            - redis7-data:/data

    clickhouse:
        #
        # Note: please keep the default version in sync across
        #       `posthog` and the `charts-clickhouse` repos
        #
        extends:
            file: docker-compose.base.yml
            service: clickhouse
        mem_limit: "${POSTHOG_CLICKHOUSE_MEM_LIMIT:-4g}"
        mem_reservation: "${POSTHOG_CLICKHOUSE_MEM_RESERVATION:-2g}"
        cpus: "${POSTHOG_CLICKHOUSE_CPUS:-2.0}"
        pids_limit: "${POSTHOG_CLICKHOUSE_PIDS_LIMIT:-1024}"
        restart: on-failure
        logging: *default-logging
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/posthog/idl:/idl
            - ./posthog/docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./posthog/docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./posthog/docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./posthog/docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./posthog/docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        extends:
            file: docker-compose.base.yml
            service: zookeeper
        mem_limit: "${POSTHOG_ZOOKEEPER_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_ZOOKEEPER_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_ZOOKEEPER_CPUS:-0.75}"
        pids_limit: "${POSTHOG_ZOOKEEPER_PIDS_LIMIT:-256}"
        logging: *default-logging
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs
    kafka:
        extends:
            file: docker-compose.base.yml
            service: kafka
        mem_limit: "${POSTHOG_KAFKA_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_KAFKA_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_KAFKA_CPUS:-1.0}"
        pids_limit: "${POSTHOG_KAFKA_PIDS_LIMIT:-512}"
        logging: *default-logging
        depends_on:
            - zookeeper
        environment:
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        volumes:
            - kafka-data:/bitnami/kafka

    worker:
        extends:
            file: docker-compose.base.yml
            service: worker
        mem_limit: "${POSTHOG_WORKER_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_WORKER_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_WORKER_CPUS:-1.0}"
        pids_limit: "${POSTHOG_WORKER_PIDS_LIMIT:-512}"
        logging: *default-logging
        environment:
            SITE_URL: https://posthog.${WALTER_DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET:?required}
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://posthog.${WALTER_DOMAIN}
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            PERSONHOG_ADDR: 'http://personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        image: ${REGISTRY_URL:?required}:${POSTHOG_APP_TAG:?required}
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
            personhog-router:
                condition: service_started
    web:
        extends:
            file: docker-compose.base.yml
            service: web
        mem_limit: "${POSTHOG_WEB_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_WEB_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_WEB_CPUS:-1.0}"
        pids_limit: "${POSTHOG_WEB_PIDS_LIMIT:-512}"
        command: /compose/start
        logging: *default-logging
        volumes:
            - ./compose:/compose
        image: ${REGISTRY_URL:?required}:${POSTHOG_APP_TAG:?required}
        environment:
            SITE_URL: https://posthog.${WALTER_DOMAIN}
            LIVESTREAM_HOST: 'https://posthog.${WALTER_DOMAIN}/livestream'
            SECRET_KEY: ${POSTHOG_SECRET:?required}
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://posthog.${WALTER_DOMAIN}
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
            DEPLOYMENT: 'hobby'
            PERSONHOG_ADDR: 'http://personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - personhog-router

    plugins:
        extends:
            file: docker-compose.base.yml
            service: plugins
        mem_limit: "${POSTHOG_PLUGINS_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_PLUGINS_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_PLUGINS_CPUS:-1.0}"
        pids_limit: "${POSTHOG_PLUGINS_PIDS_LIMIT:-512}"
        # Pulled 2026-05-12 from operator VM via docker inspect
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        environment:
            SITE_URL: https://posthog.${WALTER_DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET:?required}
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://posthog.${WALTER_DOMAIN}
            OBJECT_STORAGE_ENABLED: true
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
            CYCLOTRON_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        volumes:
            - ./share:/share
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    ingestion-general:
        extends:
            file: docker-compose.base.yml
            service: ingestion-general
        mem_limit: "${POSTHOG_INGESTION_GENERAL_MEM_LIMIT:-768m}"
        mem_reservation: "${POSTHOG_INGESTION_GENERAL_MEM_RESERVATION:-384m}"
        cpus: "${POSTHOG_INGESTION_GENERAL_CPUS:-1.0}"
        pids_limit: "${POSTHOG_INGESTION_GENERAL_PIDS_LIMIT:-512}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        environment:
            PERSONS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka

    ingestion-sessionreplay:
        extends:
            file: docker-compose.base.yml
            service: ingestion-sessionreplay
        mem_limit: "${POSTHOG_INGESTION_SESSIONREPLAY_MEM_LIMIT:-768m}"
        mem_reservation: "${POSTHOG_INGESTION_SESSIONREPLAY_MEM_RESERVATION:-384m}"
        cpus: "${POSTHOG_INGESTION_SESSIONREPLAY_CPUS:-1.0}"
        pids_limit: "${POSTHOG_INGESTION_SESSIONREPLAY_PIDS_LIMIT:-512}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        environment:
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
        depends_on:
            - db
            - redis7
            - kafka
            - seaweedfs

    recording-api:
        extends:
            file: docker-compose.base.yml
            service: recording-api
        mem_limit: "${POSTHOG_RECORDING_API_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_RECORDING_API_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_RECORDING_API_CPUS:-0.75}"
        pids_limit: "${POSTHOG_RECORDING_API_PIDS_LIMIT:-256}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        environment:
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
        depends_on:
            - db
            - redis7
            - clickhouse

    ingestion-error-tracking:
        extends:
            file: docker-compose.base.yml
            service: ingestion-error-tracking
        mem_limit: "${POSTHOG_INGESTION_ERROR_TRACKING_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_INGESTION_ERROR_TRACKING_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_INGESTION_ERROR_TRACKING_CPUS:-0.75}"
        pids_limit: "${POSTHOG_INGESTION_ERROR_TRACKING_PIDS_LIMIT:-256}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        environment:
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?required}
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-logs:
        extends:
            file: docker-compose.base.yml
            service: ingestion-logs
        mem_limit: "${POSTHOG_INGESTION_LOGS_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_INGESTION_LOGS_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_INGESTION_LOGS_CPUS:-0.75}"
        pids_limit: "${POSTHOG_INGESTION_LOGS_PIDS_LIMIT:-256}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-traces:
        extends:
            file: docker-compose.base.yml
            service: ingestion-traces
        mem_limit: "${POSTHOG_INGESTION_TRACES_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_INGESTION_TRACES_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_INGESTION_TRACES_CPUS:-0.75}"
        pids_limit: "${POSTHOG_INGESTION_TRACES_PIDS_LIMIT:-256}"
        image: ${REGISTRY_URL:-ghcr.io/posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        logging: *default-logging
        depends_on:
            - db
            - redis7
            - kafka

    proxy:
        extends:
            file: docker-compose.base.yml
            service: proxy
        mem_limit: "${POSTHOG_PROXY_MEM_LIMIT:-256m}"
        mem_reservation: "${POSTHOG_PROXY_MEM_RESERVATION:-128m}"
        cpus: "${POSTHOG_PROXY_CPUS:-0.5}"
        pids_limit: "${POSTHOG_PROXY_PIDS_LIMIT:-128}"
        logging: *default-logging
        ports:
            - '127.0.0.1:8100:8000'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDY_TLS_BLOCK: ''
            CADDY_HOST: 'http://'
        depends_on:
            - web
            - livestream
    objectstorage:
        extends:
            file: docker-compose.base.yml
            service: objectstorage

        mem_limit: "${POSTHOG_OBJECTSTORAGE_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_OBJECTSTORAGE_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_OBJECTSTORAGE_CPUS:-0.75}"
        pids_limit: "${POSTHOG_OBJECTSTORAGE_PIDS_LIMIT:-256}"
        restart: on-failure
        logging: *default-logging
        volumes:
            - objectstorage:/data
        ports:
            - '127.0.0.1:19000:19000'
            - '127.0.0.1:19001:19001'

    seaweedfs:
        extends:
            file: docker-compose.base.yml
            service: seaweedfs
        container_name: '${SEAWEEDFS_DOCKER_NAME:-seaweedfs-main}'
        mem_limit: "${POSTHOG_SEAWEEDFS_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_SEAWEEDFS_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_SEAWEEDFS_CPUS:-0.75}"
        pids_limit: "${POSTHOG_SEAWEEDFS_PIDS_LIMIT:-256}"
        restart: on-failure
        logging: *default-logging
        ports:
            - '127.0.0.1:8333:8333' # S3 API
            - '127.0.0.1:9333:9333' # Master server
        volumes:
            - seaweedfs:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog",
                ]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s

    asyncmigrationscheck:
        extends:
            file: docker-compose.base.yml
            service: asyncmigrationscheck
        mem_limit: "${POSTHOG_ASYNC_MIGRATIONS_CHECK_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_ASYNC_MIGRATIONS_CHECK_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_ASYNC_MIGRATIONS_CHECK_CPUS:-0.75}"
        pids_limit: "${POSTHOG_ASYNC_MIGRATIONS_CHECK_PIDS_LIMIT:-256}"
        image: ${REGISTRY_URL:?required}:${POSTHOG_APP_TAG:?required}
        logging: *default-logging
        environment:
            SITE_URL: https://posthog.${WALTER_DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET:?required}
            SKIP_ASYNC_MIGRATIONS_SETUP: 0

    # Temporal containers
    temporal:
        extends:
            file: docker-compose.base.yml
            service: temporal
        mem_limit: "${POSTHOG_TEMPORAL_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_TEMPORAL_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_TEMPORAL_CPUS:-1.0}"
        pids_limit: "${POSTHOG_TEMPORAL_PIDS_LIMIT:-512}"
        logging: *default-logging
        environment:
            - ENABLE_ES=false
        ports:
            - 127.0.0.1:7233:7233
        volumes:
            - ./posthog/docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    elasticsearch:
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
        mem_limit: "${POSTHOG_ELASTICSEARCH_MEM_LIMIT:-2g}"
        mem_reservation: "${POSTHOG_ELASTICSEARCH_MEM_RESERVATION:-1g}"
        cpus: "${POSTHOG_ELASTICSEARCH_CPUS:-1.5}"
        pids_limit: "${POSTHOG_ELASTICSEARCH_PIDS_LIMIT:-512}"
        logging: *default-logging
    temporal-admin-tools:
        extends:
            file: docker-compose.base.yml
            service: temporal-admin-tools
        mem_limit: "${POSTHOG_TEMPORAL_ADMIN_TOOLS_MEM_LIMIT:-256m}"
        mem_reservation: "${POSTHOG_TEMPORAL_ADMIN_TOOLS_MEM_RESERVATION:-128m}"
        cpus: "${POSTHOG_TEMPORAL_ADMIN_TOOLS_CPUS:-0.5}"
        pids_limit: "${POSTHOG_TEMPORAL_ADMIN_TOOLS_PIDS_LIMIT:-128}"
        logging: *default-logging
        depends_on:
            - temporal
    temporal-ui:
        extends:
            file: docker-compose.base.yml
            service: temporal-ui
        mem_limit: "${POSTHOG_TEMPORAL_UI_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_TEMPORAL_UI_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_TEMPORAL_UI_CPUS:-0.75}"
        pids_limit: "${POSTHOG_TEMPORAL_UI_PIDS_LIMIT:-256}"
        logging: *default-logging
        ports:
            - 127.0.0.1:8181:8080
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy
    temporal-django-worker:
        command: /compose/temporal-django-worker
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        mem_limit: "${POSTHOG_TEMPORAL_DJANGO_WORKER_MEM_LIMIT:-1g}"
        mem_reservation: "${POSTHOG_TEMPORAL_DJANGO_WORKER_MEM_RESERVATION:-512m}"
        cpus: "${POSTHOG_TEMPORAL_DJANGO_WORKER_CPUS:-1.0}"
        pids_limit: "${POSTHOG_TEMPORAL_DJANGO_WORKER_PIDS_LIMIT:-512}"
        logging: *default-logging
        volumes:
            - ./compose:/compose
        image: ${REGISTRY_URL:?required}:${POSTHOG_APP_TAG:?required}
        environment:
            SITE_URL: https://posthog.${WALTER_DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET:?required}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    cyclotron-janitor:
        extends:
            file: docker-compose.base.yml
            service: cyclotron-janitor
        mem_limit: "${POSTHOG_CYCLOTRON_JANITOR_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_CYCLOTRON_JANITOR_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_CYCLOTRON_JANITOR_CPUS:-0.75}"
        pids_limit: "${POSTHOG_CYCLOTRON_JANITOR_PIDS_LIMIT:-256}"
        build:
            context: ./posthog/rust
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    capture:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: capture
        mem_limit: "${POSTHOG_CAPTURE_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_CAPTURE_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_CAPTURE_CPUS:-0.75}"
        pids_limit: "${POSTHOG_CAPTURE_PIDS_LIMIT:-256}"
        logging: *default-logging

    replay-capture:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: replay-capture
        mem_limit: "${POSTHOG_REPLAY_CAPTURE_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_REPLAY_CAPTURE_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_REPLAY_CAPTURE_CPUS:-0.75}"
        pids_limit: "${POSTHOG_REPLAY_CAPTURE_PIDS_LIMIT:-256}"
        logging: *default-logging

    property-defs-rs:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: property-defs-rs
        mem_limit: "${POSTHOG_PROPERTY_DEFS_RS_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_PROPERTY_DEFS_RS_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_PROPERTY_DEFS_RS_CPUS:-0.75}"
        pids_limit: "${POSTHOG_PROPERTY_DEFS_RS_PIDS_LIMIT:-256}"
        logging: *default-logging
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    livestream:
        extends:
            file: docker-compose.base.yml
            service: livestream
        mem_limit: "${POSTHOG_LIVESTREAM_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_LIVESTREAM_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_LIVESTREAM_CPUS:-0.75}"
        pids_limit: "${POSTHOG_LIVESTREAM_PIDS_LIMIT:-256}"
        logging: *default-logging
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET:?required}
        volumes:
            - ./posthog/docker/livestream/configs-hobby.yml:/configs/configs.yml

    personhog-replica:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: personhog-replica
        mem_limit: "${POSTHOG_PERSONHOG_REPLICA_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_PERSONHOG_REPLICA_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_PERSONHOG_REPLICA_CPUS:-0.75}"
        pids_limit: "${POSTHOG_PERSONHOG_REPLICA_PIDS_LIMIT:-256}"
        logging: *default-logging
        environment:
            PRIMARY_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
        depends_on:
            db:
                condition: service_healthy

    personhog-router:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: personhog-router
        mem_limit: "${POSTHOG_PERSONHOG_ROUTER_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_PERSONHOG_ROUTER_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_PERSONHOG_ROUTER_CPUS:-0.75}"
        pids_limit: "${POSTHOG_PERSONHOG_ROUTER_PIDS_LIMIT:-256}"
        logging: *default-logging
        depends_on:
            - personhog-replica

    feature-flags:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: feature-flags
        mem_limit: "${POSTHOG_FEATURE_FLAGS_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_FEATURE_FLAGS_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_FEATURE_FLAGS_CPUS:-0.75}"
        pids_limit: "${POSTHOG_FEATURE_FLAGS_PIDS_LIMIT:-256}"
        logging: *default-logging
        depends_on:
            - db
            - redis7

    hypercache-server:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: hypercache-server
        mem_limit: "${POSTHOG_HYPERCACHE_SERVER_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_HYPERCACHE_SERVER_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_HYPERCACHE_SERVER_CPUS:-0.75}"
        pids_limit: "${POSTHOG_HYPERCACHE_SERVER_PIDS_LIMIT:-256}"
        logging: *default-logging
        depends_on:
            - redis7

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        mem_limit: "${POSTHOG_KAFKA_INIT_MEM_LIMIT:-256m}"
        mem_reservation: "${POSTHOG_KAFKA_INIT_MEM_RESERVATION:-128m}"
        cpus: "${POSTHOG_KAFKA_INIT_CPUS:-0.5}"
        pids_limit: "${POSTHOG_KAFKA_INIT_PIDS_LIMIT:-128}"
        entrypoint: /bin/sh
        logging: *default-logging
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$((ELAPSED + 2))
                    if [ $ELAPSED -ge $TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                        echo "Final attempt to list topics:"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done
                echo "Kafka broker is accepting requests, creating topics..."
                for topic in clickhouse_events_json; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done
                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    cymbal:
        # Pulled 2026-05-12 from operator VM via docker inspect
        image: ghcr.io/posthog/posthog/cymbal@sha256:f1212fadbb00bc088b10becabdd23977d52adfa869e7f4b47eab0ca547afa990
        mem_limit: "${POSTHOG_CYMBAL_MEM_LIMIT:-512m}"
        mem_reservation: "${POSTHOG_CYMBAL_MEM_RESERVATION:-256m}"
        cpus: "${POSTHOG_CYMBAL_CPUS:-0.75}"
        pids_limit: "${POSTHOG_CYMBAL_PIDS_LIMIT:-256}"
        build:
            context: ./posthog/rust
            args:
                BIN: cymbal
        restart: on-failure
        logging: *default-logging
        volumes:
            - ./share:/share
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            OBJECT_STORAGE_BUCKET: posthog
            OBJECT_STORAGE_ACCESS_KEY_ID: 'any'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: 'http://seaweedfs:8333'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            PERSONS_URL: 'postgres://posthog:${POSTHOG_DB_PASS:?required}@db:5432/posthog'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

volumes:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    objectstorage:
    seaweedfs:
    postgres-data:
    clickhouse-data:
    caddy-data:
    caddy-config:
    redis7-data:
    kafka-data:
    redpanda-data:
