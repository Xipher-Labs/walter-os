services:
  uptime-kuma:
    mem_limit: "${UPTIME_KUMA_MEM_LIMIT:-384m}"
    mem_reservation: "${UPTIME_KUMA_MEM_RESERVATION:-192m}"
    cpus: "${UPTIME_KUMA_CPUS:-0.5}"
    pids_limit: 256
    image: louislam/uptime-kuma:2.3.2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
volumes:
  uptime-kuma-data:
