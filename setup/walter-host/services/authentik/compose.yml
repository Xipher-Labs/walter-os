# Optional Authentik SSO profile for Walter-OS.
# Start explicitly with:
#   docker compose --profile authentik up -d

services:
  authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    mem_limit: "${AUTHENTIK_POSTGRESQL_MEM_LIMIT:-512m}"
    mem_reservation: "${AUTHENTIK_POSTGRESQL_MEM_RESERVATION:-256m}"
    cpus: "${AUTHENTIK_POSTGRESQL_CPUS:-0.75}"
    pids_limit: "${AUTHENTIK_POSTGRESQL_PIDS_LIMIT:-256}"
    restart: unless-stopped
    profiles: ["authentik"]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_POSTGRESQL__PASSWORD:?required - set in .env or fetch from Infisical}"
    volumes:
      - authentik-postgresql-data:/var/lib/postgresql/data
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: docker.io/library/redis:7-alpine
    container_name: authentik-redis
    mem_limit: "${AUTHENTIK_REDIS_MEM_LIMIT:-256m}"
    mem_reservation: "${AUTHENTIK_REDIS_MEM_RESERVATION:-128m}"
    cpus: "${AUTHENTIK_REDIS_CPUS:-0.5}"
    pids_limit: "${AUTHENTIK_REDIS_PIDS_LIMIT:-128}"
    restart: unless-stopped
    profiles: ["authentik"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - authentik-redis-data:/data
    networks:
      - authentik
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.2
    container_name: authentik-server
    mem_limit: "${AUTHENTIK_SERVER_MEM_LIMIT:-1g}"
    mem_reservation: "${AUTHENTIK_SERVER_MEM_RESERVATION:-512m}"
    cpus: "${AUTHENTIK_SERVER_CPUS:-1.0}"
    pids_limit: "${AUTHENTIK_SERVER_PIDS_LIMIT:-512}"
    restart: unless-stopped
    profiles: ["authentik"]
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?required - generate with openssl rand -base64 60}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRESQL__PASSWORD:?required - set in .env or fetch from Infisical}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-data:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    expose:
      - "9000"
    networks:
      - authentik

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.2
    container_name: authentik-worker
    mem_limit: "${AUTHENTIK_WORKER_MEM_LIMIT:-768m}"
    mem_reservation: "${AUTHENTIK_WORKER_MEM_RESERVATION:-384m}"
    cpus: "${AUTHENTIK_WORKER_CPUS:-1.0}"
    pids_limit: "${AUTHENTIK_WORKER_PIDS_LIMIT:-512}"
    restart: unless-stopped
    profiles: ["authentik"]
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?required - generate with openssl rand -base64 60}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRESQL__PASSWORD:?required - set in .env or fetch from Infisical}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-data:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    networks:
      - authentik

volumes:
  authentik-postgresql-data:
  authentik-redis-data:
  authentik-data:
  authentik-certs:
  authentik-templates:

networks:
  authentik:
    name: authentik
