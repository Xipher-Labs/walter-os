# Infisical with migration-on-startup pattern
# Override command so backend runs migration before starting server.

services:
  infisical-backend:
    image: infisical/infisical:v0.159.25
    container_name: infisical-backend
    mem_limit: "${INFISICAL_BACKEND_MEM_LIMIT:-768m}"
    mem_reservation: "${INFISICAL_BACKEND_MEM_RESERVATION:-384m}"
    cpus: "${INFISICAL_BACKEND_CPUS:-1.0}"
    pids_limit: "${INFISICAL_BACKEND_PIDS_LIMIT:-512}"
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgresql://infisical:${INFISICAL_DB_PASS}@infisical-db:5432/infisical"
      REDIS_URL: "redis://default:${INFISICAL_REDIS_PASS}@infisical-redis:6379"
      SITE_URL: "https://secrets.${WALTER_DOMAIN}"
      TELEMETRY_ENABLED: "false"
    entrypoint: ["/bin/sh"]
    command: ["-c", "npm run migration:latest && node /backend/dist/main.mjs"]
    ports:
      - "127.0.0.1:8800:8080"
    networks:
      - infisical
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  infisical-db:
    image: postgres:16-alpine
    container_name: infisical-db
    mem_limit: "${INFISICAL_DB_MEM_LIMIT:-512m}"
    mem_reservation: "${INFISICAL_DB_MEM_RESERVATION:-256m}"
    cpus: "${INFISICAL_DB_CPUS:-0.75}"
    pids_limit: "${INFISICAL_DB_PIDS_LIMIT:-256}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: "${INFISICAL_DB_PASS}"
      POSTGRES_DB: infisical
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT CASE WHEN count(*) < (current_setting('max_connections')::int - current_setting('superuser_reserved_connections')::int) THEN 1 ELSE 0 END FROM pg_stat_activity\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    mem_limit: "${INFISICAL_REDIS_MEM_LIMIT:-256m}"
    mem_reservation: "${INFISICAL_REDIS_MEM_RESERVATION:-128m}"
    cpus: "${INFISICAL_REDIS_CPUS:-0.5}"
    pids_limit: "${INFISICAL_REDIS_PIDS_LIMIT:-128}"
    restart: unless-stopped
    command: redis-server --requirepass "${INFISICAL_REDIS_PASS}"
    volumes:
      - infisical-redis-data:/data
    networks:
      - infisical
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$INFISICAL_REDIS_PASS ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      INFISICAL_REDIS_PASS: "${INFISICAL_REDIS_PASS}"

volumes:
  infisical-db-data:
  infisical-redis-data:

networks:
  infisical:
    name: infisical
