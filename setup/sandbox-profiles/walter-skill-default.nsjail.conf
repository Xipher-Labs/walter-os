# Walter-OS skill sandbox profile.
# Workspace scope is writable; operator config is read-only; sensitive homes hidden.
name: "walter-skill-default"
mode: ONCE
hostname: "walter-skill"
cwd: "@WALTER_SANDBOX_CWD@"

rlimit_as: 1024
rlimit_cpu: 300
rlimit_fsize: 512
rlimit_nofile: 256

keep_env: false
keep_caps: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin"
envar: "HOME=@HOME@"
envar: "USER"
envar: "LANG"
envar: "WALTER_CONFIG=@WALTER_CONFIG@"
envar: "WALTER_OS_HOME=@WALTER_OS_HOME@"

mount {
  src: "@WALTER_NSJAIL_ROOT@"
  dst: "/"
  is_bind: true
  rw: false
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  is_bind: false
  mandatory: false
}
mount {
  src: "@WALTER_SANDBOX_PARENT@"
  dst: "@WALTER_SANDBOX_PARENT@"
  is_bind: true
  rw: true
}
@WALTER_NSJAIL_SENSITIVE_KEY_MASKS@
mount {
  src: "@WALTER_CONFIG@"
  dst: "@WALTER_CONFIG@"
  is_bind: true
  rw: false
  mandatory: false
}
@WALTER_NSJAIL_CONFIG_KEY_MASKS@
@WALTER_NSJAIL_SESSION_KEY_MASKS@
mount {
  dst: "@HOME@/.ssh"
  fstype: "tmpfs"
  rw: false
  is_bind: false
  mandatory: false
}
mount {
  dst: "@HOME@/.aws"
  fstype: "tmpfs"
  rw: false
  is_bind: false
  mandatory: false
}
mount {
  dst: "@HOME@/.gnupg"
  fstype: "tmpfs"
  rw: false
  is_bind: false
  mandatory: false
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/passwd"
  dst: "/etc/passwd"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/group"
  dst: "/etc/group"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/nsswitch.conf"
  dst: "/etc/nsswitch.conf"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/hosts"
  dst: "/etc/hosts"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/resolv.conf"
  dst: "/etc/resolv.conf"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc/gitconfig"
  dst: "/etc/gitconfig"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  mandatory: false
}
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
mount_proc: false
disable_no_new_privs: false
