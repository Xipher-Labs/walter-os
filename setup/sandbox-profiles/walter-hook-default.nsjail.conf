# Walter-OS hook sandbox profile.
# Read-only Walter roots, no network, no ambient capabilities.
name: "walter-hook-default"
mode: ONCE
hostname: "walter-hook"

rlimit_as: 512
rlimit_cpu: 30
rlimit_fsize: 100
rlimit_nofile: 64

keep_env: false
keep_caps: false
envar: "PATH=/usr/bin:/bin:/usr/sbin:/sbin"
envar: "HOME=@HOME@"
envar: "USER"
envar: "LANG"
envar: "WALTER_CONFIG=@WALTER_CONFIG@"
envar: "WALTER_OS_HOME=@WALTER_OS_HOME@"

mount {
  dst: "/"
  fstype: "tmpfs"
  rw: true
  is_bind: false
}
mount {
  src: "@WALTER_OS_HOME@"
  dst: "@WALTER_OS_HOME@"
  is_bind: true
  rw: false
}
mount {
  src: "@WALTER_CONFIG@"
  dst: "@WALTER_CONFIG@"
  is_bind: true
  rw: false
}
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
  mandatory: false
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  is_bind: false
  mandatory: false
}

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
mount_proc: false
disable_no_new_privs: false
iface_no_lo: true
