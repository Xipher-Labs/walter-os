# Headscale config placeholder for the root all-in-one compose stack.
#
# Regenerate with:
#   WALTER_DOMAIN=your-domain.example envsubst '$WALTER_DOMAIN' \
#     < setup/headscale/config.yaml.template > setup/headscale/config.yaml
#   docker restart headscale  # optional, only if the container is running
#
# Headscale does not expand ${...} itself. install.sh renders this file before
# root docker compose startup; scripts/bootstrap.sh also renders it during
# bootstrap/re-bootstrap.

server_url: https://headscale.${WALTER_DOMAIN}
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  level: info

disable_check_updates: true

dns:
  override_local_dns: false
  magic_dns: true
  base_domain: walter.local
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

noise:
  private_key_path: /var/lib/headscale/noise_private.key
