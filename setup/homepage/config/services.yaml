# Homepage service configuration — Walter-OS
# Refs: https://gethomepage.dev/configs/services/
#
# DEFAULT contents below show ONLY services in the `core` profile —
# the ones that start with `docker compose up -d` (no profile flag).
#
# Profile-specific services (comms / design / devrel / assistant) are
# commented out at the bottom. Uncomment the block that matches the
# profile(s) you enabled in `compose.yml`.
#
# Verify which services are actually running:
#   docker compose ps --format '{{.Service}}' | sort

# =============================================================================
# CORE — always available (docker compose up -d, no profile flag needed)
# =============================================================================

- Agents & AI:
    - Control Tower:
        href: "https://tower.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Multi-agent orchestration GUI (Tailscale-only)
        icon: mdi-robot
    - LiteLLM:
        href: "https://llm.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Walter-Bridge LLM gateway
        icon: openai.png
    - n8n:
        href: "https://n8n.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Workflow automation
        icon: n8n.png

- Project Management:
    - Plane:
        href: "https://plane.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Issues + sprints + docs
        icon: plane.png

- Developer Tools:
    - Forgejo:
        href: "https://git.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Self-hosted Git
        icon: gitea.png

- Security:
    - Infisical:
        href: "https://secrets.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Secrets manager
        icon: infisical.png

- Observability:
    - Grafana:
        href: "https://grafana.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Dashboards (Prometheus + Loki)
        icon: grafana.png
    - Uptime Kuma:
        href: "https://status.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Uptime monitoring
        icon: uptime-kuma.png

- Network:
    - WireGuard:
        href: "https://vpn.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: VPN management (wg-easy)
        icon: wireguard.png
    - Headscale:
        href: "https://headscale.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Tailscale control plane
        icon: tailscale.png
    - Syncthing:
        href: "https://sync.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: File sync (multi-device)
        icon: syncthing.png

