# Homepage service configuration — Walter-OS
# Refs: https://gethomepage.dev/configs/services/
#
# DEFAULT contents below show ONLY services in the `core` profile —
# the ones that start with `docker compose up -d` (no profile flag).
#
# Profile-specific services (comms / design / devrel / assistant) are
# commented out at the bottom. Uncomment the block that matches the
# profile(s) you enabled in `compose.yml`.
#
# Verify which services are actually running:
#   docker compose ps --format '{{.Service}}' | sort

# =============================================================================
# CORE — always available (docker compose up -d, no profile flag needed)
# =============================================================================

- Agents & AI:
    - Control Tower:
        href: "https://tower.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Multi-agent orchestration GUI
        icon: mdi-robot
    - OpenClaw:
        href: "https://claw.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Personal-assistant gateway (Telegram + Matrix)
        icon: mdi-hand-extended
    - Hermes Agent:
        href: "https://hermes.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Self-hostable agentic framework (Nous Research)
        icon: mdi-rocket-launch
    - LiteLLM:
        href: "https://llm.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Walter-Bridge LLM gateway
        icon: openai.png
    - n8n:
        href: "https://n8n.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Workflow automation
        icon: n8n.png

- Project Management:
    - Plane:
        href: "https://plane.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Issues + sprints + docs
        icon: plane.png

- Developer Tools:
    - Forgejo:
        href: "https://git.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Self-hosted Git
        icon: gitea.png

- Security:
    - Infisical:
        href: "https://secrets.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Secrets manager
        icon: infisical.png

- Observability:
    - Grafana:
        href: "https://grafana.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Dashboards (Prometheus + Loki)
        icon: grafana.png
    - Uptime Kuma:
        href: "https://status.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Uptime monitoring
        icon: uptime-kuma.png

- Network:
    - WireGuard:
        href: "https://vpn.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: VPN management (wg-easy)
        icon: wireguard.png
    - Headscale:
        href: "https://headscale.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Tailscale control plane
        icon: tailscale.png
    - Syncthing:
        href: "https://sync.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: File sync (multi-device)
        icon: syncthing.png

- Communications:
    - RocketChat:
        href: "https://chat.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Team chat
        icon: rocket-chat.png
    - Element (Matrix):
        href: "https://element.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Matrix client (federation OFF; CF Access gated)
        icon: element.png

- Design & Diagrams:
    - Penpot:
        href: "https://penpot.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Design + prototypes
        icon: penpot.png
    - Drawio:
        href: "https://draw.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Diagrams
        icon: drawio.png

- Marketing & Analytics:
    - Metabase:
        href: "https://metabase.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: BI dashboards + SQL queries
        icon: metabase.png
    - Postiz:
        href: "https://postiz.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Social media scheduling
        icon: mdi-share-variant
    - PostHog:
        href: "https://posthog.{{HOMEPAGE_VAR_WALTER_DOMAIN}}"
        description: Product analytics + session replay
        icon: mdi-chart-line
